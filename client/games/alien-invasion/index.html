<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Alien Invasion Arcade - ezze.games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; font-family: 'Bungee', cursive; }
    body { background: #020617; color: #fff; width: 100vw; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    #canvasWrap { position: relative; width: 100%; height: 100%; max-width: 540px; max-height: 800px; box-shadow: 0 0 35px rgba(56, 189, 248, 0.3); border: 2px solid #1e293b; border-radius: 12px; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; background: #000; }
    .hud { position: absolute; top: 12px; left: 16px; right: 16px; display: flex; justify-content: space-between; font-size: 15px; color: #38bdf8; z-index: 10; pointer-events: none; }
    .overlay { position: absolute; inset: 0; background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 20px; z-index: 20; }
    .overlay.hidden { display: none; }
    .btn-play { background: linear-gradient(135deg, #38bdf8, #0284c7); color: #fff; font-family: 'Bungee'; font-size: 20px; padding: 14px 34px; border: none; border-radius: 14px; cursor: pointer; box-shadow: 0 8px 0 #0369a1; }
    .touch-controls { position: absolute; bottom: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; z-index: 15; pointer-events: none; }
    .t-btn { width: 64px; height: 64px; border-radius: 50%; background: rgba(30, 41, 59, 0.8); border: 2px solid #38bdf8; color: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
    .t-btn:active { background: #38bdf8; color: #000; }
  </style>
</head>
<body>
  <div id="canvasWrap">
    <div class="hud">
      <div>PUNTOS: <span id="hudScore">0</span></div>
      <div>VIDAS: <span id="hudLives">❤️❤️❤️</span></div>
    </div>
    <canvas id="spaceCanvas" width="480" height="640"></canvas>
    <div class="touch-controls">
      <div style="display: flex; gap: 10px;">
        <button class="t-btn" id="btnLeft">◀</button>
        <button class="t-btn" id="btnRight">▶</button>
      </div>
      <button class="t-btn" style="background: rgba(239, 68, 68, 0.8); border-color: #ef4444;" id="btnFire">🔥</button>
    </div>
    <div class="overlay" id="startScreen">
      <h1 style="font-size: 38px; color: #38bdf8; text-shadow: 0 0 20px rgba(56, 189, 248, 0.8);">ALIEN INVASION</h1>
      <p style="font-family: 'Outfit'; font-size: 15px; color: #94a3b8;">¡Defiende la galaxia de oleadas alienígenas!</p>
      <button class="btn-play" id="btnStart">COMENZAR MISIÓN</button>
    </div>
    <div class="overlay hidden" id="gameOverScreen">
      <h1 style="font-size: 36px; color: #ef4444;">¡BASE DESTRUIDA!</h1>
      <p style="font-family: 'Outfit'; font-size: 18px; color: #cbd5e1;">Puntos conseguidos: <strong id="finalScore" style="color: #38bdf8;">0</strong></p>
      <button class="btn-play" id="btnRestart">JUGAR DE NUEVO</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('spaceCanvas');
    const ctx = canvas.getContext('2d');

    let audioCtx = null;
    function playLaser() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    }
    function playExplode() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }

    let ship = { x: 240, y: 570, w: 36, h: 24, vx: 0 };
    let bullets = [];
    let alienBullets = [];
    let aliens = [];
    let stars = [];
    let score = 0;
    let lives = 3;
    let isPlaying = false;
    let alienDir = 1;
    let alienSpeed = 1.2;

    for (let i = 0; i < 60; i++) {
      stars.push({ x: Math.random() * 480, y: Math.random() * 640, r: Math.random() * 2, s: Math.random() * 2 + 1 });
    }

    function initAliens() {
      aliens = [];
      const colors = ['#f43f5e', '#ec4899', '#38bdf8', '#10b981'];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 8; c++) {
          aliens.push({ x: 50 + c * 48, y: 70 + r * 38, w: 32, h: 22, color: colors[r], alive: true });
        }
      }
    }

    function startGame() {
      ship.x = 240;
      bullets = [];
      alienBullets = [];
      score = 0;
      lives = 3;
      alienDir = 1;
      alienSpeed = 1.2;
      initAliens();
      isPlaying = true;
      document.getElementById('hudScore').textContent = '0';
      document.getElementById('hudLives').textContent = '❤️❤️❤️';
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
    }

    function fire() {
      if (!isPlaying || bullets.length >= 3) return;
      bullets.push({ x: ship.x, y: ship.y - 10, vy: -9 });
      playLaser();
    }

    let keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space') fire();
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    const bindTouch = (id, fnStart, fnEnd) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); fnStart(); });
      el.addEventListener('touchend', (e) => { e.preventDefault(); if (fnEnd) fnEnd(); });
      el.addEventListener('mousedown', fnStart);
      el.addEventListener('mouseup', fnEnd || (() => {}));
    };
    bindTouch('btnLeft', () => keys['ArrowLeft'] = true, () => keys['ArrowLeft'] = false);
    bindTouch('btnRight', () => keys['ArrowRight'] = true, () => keys['ArrowRight'] = false);
    bindTouch('btnFire', fire);

    function update() {
      // Estrellas
      stars.forEach(s => {
        s.y += s.s;
        if (s.y > 640) s.y = 0;
      });

      if (!isPlaying) return;

      // Nave
      if (keys['ArrowLeft'] || keys['KeyA']) ship.x = Math.max(20, ship.x - 5.5);
      if (keys['ArrowRight'] || keys['KeyD']) ship.x = Math.min(460, ship.x + 5.5);

      // Balas jugador
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y += b.vy;

        // Impacto con aliens
        aliens.forEach(a => {
          if (a.alive && b.x > a.x - a.w / 2 && b.x < a.x + a.w / 2 && b.y > a.y - a.h / 2 && b.y < a.y + a.h / 2) {
            a.alive = false;
            b.y = -100;
            score += 100;
            playExplode();
            document.getElementById('hudScore').textContent = score;
          }
        });

        if (b.y < -10) bullets.splice(i, 1);
      }

      // Mover Aliens
      let hitEdge = false;
      aliens.forEach(a => {
        if (a.alive) {
          a.x += alienSpeed * alienDir;
          if (a.x > 450 || a.x < 30) hitEdge = true;

          // Disparo alien aleatorio
          if (Math.random() < 0.003 && alienBullets.length < 4) {
            alienBullets.push({ x: a.x, y: a.y + 15, vy: 4.5 });
          }

          // Invasión exitosa (llegaron al suelo)
          if (a.y > 540) {
            triggerGameOver();
          }
        }
      });

      if (hitEdge) {
        alienDir *= -1;
        aliens.forEach(a => a.y += 14);
        alienSpeed += 0.1;
      }

      // Balas alien
      for (let i = alienBullets.length - 1; i >= 0; i--) {
        const ab = alienBullets[i];
        ab.y += ab.vy;

        // Golpe a la nave
        if (ab.x > ship.x - ship.w / 2 && ab.x < ship.x + ship.w / 2 && ab.y > ship.y - ship.h / 2 && ab.y < ship.y + ship.h / 2) {
          lives--;
          alienBullets.splice(i, 1);
          playExplode();
          document.getElementById('hudLives').textContent = '❤️'.repeat(Math.max(0, lives));
          if (lives <= 0) triggerGameOver();
          continue;
        }

        if (ab.y > 650) alienBullets.splice(i, 1);
      }

      // Si eliminó todos los aliens, siguiente oleada
      if (aliens.every(a => !a.alive)) {
        alienSpeed += 0.5;
        initAliens();
      }
    }

    function triggerGameOver() {
      isPlaying = false;
      document.getElementById('finalScore').textContent = score;
      document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Estrellas
      ctx.fillStyle = '#fff';
      stars.forEach(s => {
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      });

      // Aliens
      aliens.forEach(a => {
        if (a.alive) {
          ctx.fillStyle = a.color;
          ctx.fillRect(a.x - a.w / 2, a.y - a.h / 2, a.w, a.h);
          ctx.fillStyle = '#000';
          ctx.fillRect(a.x - 8, a.y - 4, 4, 6);
          ctx.fillRect(a.x + 4, a.y - 4, 4, 6);
        }
      });

      // Balas
      ctx.fillStyle = '#38bdf8';
      bullets.forEach(b => ctx.fillRect(b.x - 2, b.y, 4, 12));

      ctx.fillStyle = '#ef4444';
      alienBullets.forEach(ab => ctx.fillRect(ab.x - 2, ab.y, 4, 10));

      // Nave
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(ship.x, ship.y - ship.h / 2);
      ctx.lineTo(ship.x + ship.w / 2, ship.y + ship.h / 2);
      ctx.lineTo(ship.x - ship.w / 2, ship.y + ship.h / 2);
      ctx.closePath();
      ctx.fill();

      // Reactor
      ctx.fillStyle = '#f97316';
      ctx.fillRect(ship.x - 4, ship.y + ship.h / 2, 8, 6);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    document.getElementById('btnStart').addEventListener('click', startGame);
    document.getElementById('btnRestart').addEventListener('click', startGame);

    loop();
  </script>
</body>
</html>
