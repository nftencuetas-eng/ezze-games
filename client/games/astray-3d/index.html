<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Astray 3D Maze - ezze.games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; font-family: 'Bungee', cursive; }
    body { background: #090d16; color: #fff; width: 100vw; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    #canvasWrap { position: relative; width: 100%; height: 100%; }
    canvas { width: 100%; height: 100%; display: block; }
    .hud { position: absolute; top: 16px; left: 20px; right: 20px; display: flex; justify-content: space-between; font-size: 16px; color: #38bdf8; z-index: 10; pointer-events: none; }
    .overlay { position: absolute; inset: 0; background: rgba(9, 13, 22, 0.9); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px; z-index: 30; }
    .overlay.hidden { display: none; }
    .btn-play { background: #38bdf8; color: #000; font-family: 'Bungee'; font-size: 20px; padding: 14px 36px; border: none; border-radius: 14px; cursor: pointer; box-shadow: 0 6px 0 #0284c7; }
    .d-pad { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 6px; z-index: 20; }
    .d-btn { background: rgba(30, 41, 59, 0.85); border: 2px solid #38bdf8; color: #fff; font-size: 20px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    .d-btn:active { background: #38bdf8; color: #000; }
  </style>
</head>
<body>
  <div id="canvasWrap">
    <div class="hud">
      <div>⏱️ TIEMPO: <span id="timerText">0.0s</span></div>
      <div>NIVEL: <span id="lvlText">1</span></div>
    </div>
    <canvas id="threeCanvas"></canvas>
    <div class="d-pad">
      <div></div><button class="d-btn" id="btnUp">▲</button><div></div>
      <button class="d-btn" id="btnLeft">◀</button><div></div><button class="d-btn" id="btnRight">▶</button>
      <div></div><button class="d-btn" id="btnDown">▼</button><div></div>
    </div>
    <div class="overlay" id="startScreen">
      <h1 style="font-size: 42px; color: #38bdf8; text-shadow: 0 0 25px rgba(56, 189, 248, 0.8);">ASTRAY 3D MAZE</h1>
      <p style="font-family: 'Outfit'; font-size: 16px; color: #94a3b8;">¡Guía la esfera luminosa a través del laberinto hasta la meta verde!</p>
      <button class="btn-play" id="btnStart">COMENZAR</button>
    </div>
    <div class="overlay hidden" id="winScreen">
      <h1 style="font-size: 38px; color: #10b981; text-shadow: 0 0 25px rgba(16, 185, 129, 0.8);">🎉 ¡LABERINTO COMPLETADO! 🎉</h1>
      <p style="font-family: 'Outfit'; font-size: 18px; color: #cbd5e1;">Tiempo: <strong id="winTime" style="color: #38bdf8;">0.0s</strong></p>
      <button class="btn-play" id="btnNext" style="background: #10b981; box-shadow: 0 6px 0 #059669;">SIGUIENTE NIVEL</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    let scene, camera, renderer;
    let ball, goal;
    let walls = [];
    let isPlaying = false;
    let time = 0;
    let level = 1;

    const MAZE_SIZE = 11;
    let maze = [];

    function generateMaze() {
      maze = Array.from({ length: MAZE_SIZE }, () => Array(MAZE_SIZE).fill(1));
      function carve(x, y) {
        maze[y][x] = 0;
        const dirs = [[0, -2], [0, 2], [-2, 0], [2, 0]].sort(() => Math.random() - 0.5);
        for (const [dx, dy] of dirs) {
          const nx = x + dx, ny = y + dy;
          if (nx > 0 && nx < MAZE_SIZE - 1 && ny > 0 && ny < MAZE_SIZE - 1 && maze[ny][nx] === 1) {
            maze[y + dy / 2][x + dx / 2] = 0;
            carve(nx, ny);
          }
        }
      }
      carve(1, 1);
    }

    function initThree() {
      const canvas = document.getElementById('threeCanvas');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x090d16);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 14, 8);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;

      const amb = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(amb);

      const light = new THREE.PointLight(0x38bdf8, 2, 25);
      light.position.set(0, 8, 0);
      scene.add(light);

      buildLevel();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function buildLevel() {
      // Limpiar anteriores
      walls.forEach(w => scene.remove(w));
      walls = [];
      if (ball) scene.remove(ball);
      if (goal) scene.remove(goal);

      generateMaze();

      // Suelo
      const groundGeo = new THREE.PlaneGeometry(MAZE_SIZE * 2, MAZE_SIZE * 2);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      // Muros
      const wallGeo = new THREE.BoxGeometry(2, 2, 2);
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.4 });

      for (let r = 0; r < MAZE_SIZE; r++) {
        for (let c = 0; c < MAZE_SIZE; c++) {
          if (maze[r][c] === 1) {
            const wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.set((c - MAZE_SIZE / 2 + 0.5) * 2, 1, (r - MAZE_SIZE / 2 + 0.5) * 2);
            scene.add(wall);
            walls.push(wall);
          }
        }
      }

      // Bola
      const ballGeo = new THREE.SphereGeometry(0.6, 24, 24);
      const ballMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7 });
      ball = new THREE.Mesh(ballGeo, ballMat);
      const startX = (1 - MAZE_SIZE / 2 + 0.5) * 2;
      const startZ = (1 - MAZE_SIZE / 2 + 0.5) * 2;
      ball.position.set(startX, 0.6, startZ);
      ball.userData = { vx: 0, vz: 0 };
      scene.add(ball);

      // Meta
      const goalGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.2, 16);
      const goalMat = new THREE.MeshStandardMaterial({ color: 0x10b981, emissive: 0x059669 });
      goal = new THREE.Mesh(goalGeo, goalMat);
      const endX = (MAZE_SIZE - 2 - MAZE_SIZE / 2 + 0.5) * 2;
      const endZ = (MAZE_SIZE - 2 - MAZE_SIZE / 2 + 0.5) * 2;
      goal.position.set(endX, 0.1, endZ);
      scene.add(goal);

      time = 0;
      isPlaying = true;
      document.getElementById('lvlText').textContent = level;
      document.getElementById('winScreen').classList.add('hidden');
      document.getElementById('startScreen').classList.add('hidden');
    }

    let keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    const bindD = (id, k) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[k] = true; });
      el.addEventListener('touchend', (e) => { e.preventDefault(); keys[k] = false; });
      el.addEventListener('mousedown', () => keys[k] = true);
      el.addEventListener('mouseup', () => keys[k] = false);
    };
    bindD('btnUp', 'ArrowUp');
    bindD('btnDown', 'ArrowDown');
    bindD('btnLeft', 'ArrowLeft');
    bindD('btnRight', 'ArrowRight');

    function update() {
      if (!isPlaying || !ball) return;

      time += 1 / 60;
      document.getElementById('timerText').textContent = time.toFixed(1) + 's';

      const SPEED = 0.12;
      if (keys['ArrowUp'] || keys['KeyW']) ball.userData.vz -= SPEED;
      if (keys['ArrowDown'] || keys['KeyS']) ball.userData.vz += SPEED;
      if (keys['ArrowLeft'] || keys['KeyA']) ball.userData.vx -= SPEED;
      if (keys['ArrowRight'] || keys['KeyD']) ball.userData.vx += SPEED;

      ball.userData.vx *= 0.88;
      ball.userData.vz *= 0.88;

      const nextX = ball.position.x + ball.userData.vx;
      const nextZ = ball.position.z + ball.userData.vz;

      // Colisiones con muros
      let canMoveX = true, canMoveZ = true;
      walls.forEach(w => {
        if (Math.abs(w.position.z - ball.position.z) < 1.4 && Math.abs(w.position.x - nextX) < 1.4) canMoveX = false;
        if (Math.abs(w.position.x - ball.position.x) < 1.4 && Math.abs(w.position.z - nextZ) < 1.4) canMoveZ = false;
      });

      if (canMoveX) ball.position.x = nextX;
      if (canMoveZ) ball.position.z = nextZ;

      // Cámara sigue la bola
      camera.position.x += (ball.position.x - camera.position.x) * 0.1;
      camera.position.z += (ball.position.z + 8 - camera.position.z) * 0.1;
      camera.lookAt(ball.position.x, 0, ball.position.z);

      // Victoria
      if (goal && ball.position.distanceTo(goal.position) < 1.0) {
        isPlaying = false;
        document.getElementById('winTime').textContent = time.toFixed(1) + 's';
        document.getElementById('winScreen').classList.remove('hidden');
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      update();
      renderer.render(scene, camera);
    }

    document.getElementById('btnStart').addEventListener('click', () => {
      initThree();
      animate();
    });

    document.getElementById('btnNext').addEventListener('click', () => {
      level++;
      buildLevel();
    });
  </script>
</body>
</html>
