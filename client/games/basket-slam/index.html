<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Basketball Stars Slam - ezze.games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/orientation.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; }
    body { background: #0f172a; color: #fff; font-family: 'Bungee', sans-serif; overflow: hidden; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #canvasContainer { position: relative; width: 100%; height: 100%; }
    canvas { width: 100%; height: 100%; display: block; background: radial-gradient(circle, #ea580c 0%, #9a3412 80%, #7c2d12 100%); cursor: crosshair; }
    .hud { position: absolute; top: 16px; left: 20px; right: 20px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
    .hud-box { background: rgba(15, 23, 42, 0.85); border: 2px solid #ea580c; padding: 8px 18px; border-radius: 14px; font-size: 16px; color: #ea580c; }
  </style>
</head>
<body>
  <div id="canvasContainer">
    <div class="hud">
      <div class="hud-box">CANASTAS: <span id="scoreText">0</span></div>
      <div class="hud-box" style="border-color: #facc15; color: #facc15;">RACHA: <span id="streakText">x0</span> 🔥</div>
    </div>
    <canvas id="basketCanvas"></canvas>
  </div>

  <script src="../../js/orientation.js"></script>
  <script>
    new OrientationLock({ requiresLandscape: true, onOrientationChange: () => resize() });

    const canvas = document.getElementById('basketCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    let ball = { x: 180, y: 400, vx: 0, vy: 0, r: 22, shot: false };
    let hoop = { x: 650, y: 220, w: 70, h: 10 };
    let score = 0;
    let streak = 0;
    let isAiming = false;
    let aimStart = { x: 0, y: 0 };
    let aimCurrent = { x: 0, y: 0 };

    function resetBall() {
      ball.x = 120 + Math.random() * 150;
      ball.y = height * 0.75;
      ball.vx = 0;
      ball.vy = 0;
      ball.shot = false;
    }

    const startAim = (cx, cy) => {
      if (ball.shot) return;
      isAiming = true;
      aimStart = { x: cx, y: cy };
      aimCurrent = { x: cx, y: cy };
    };

    const moveAim = (cx, cy) => {
      if (!isAiming) return;
      aimCurrent = { x: cx, y: cy };
    };

    const endAim = () => {
      if (!isAiming) return;
      isAiming = false;
      const dx = aimStart.x - aimCurrent.x;
      const dy = aimStart.y - aimCurrent.y;
      ball.vx = dx * 0.18;
      ball.vy = dy * 0.18;
      ball.shot = true;
    };

    window.addEventListener('mousedown', e => startAim(e.clientX, e.clientY));
    window.addEventListener('mousemove', e => moveAim(e.clientX, e.clientY));
    window.addEventListener('mouseup', endAim);

    window.addEventListener('touchstart', e => { if (e.touches.length > 0) startAim(e.touches[0].clientX, e.touches[0].clientY); });
    window.addEventListener('touchmove', e => { if (e.touches.length > 0) moveAim(e.touches[0].clientX, e.touches[0].clientY); });
    window.addEventListener('touchend', endAim);

    function update() {
      if (ball.shot) {
        ball.vy += 0.45; // Gravedad
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Detección de canasta
        const hoopX = width * 0.78;
        const hoopY = height * 0.42;

        if (ball.x > hoopX && ball.x < hoopX + 70 && Math.abs(ball.y - hoopY) < 15 && ball.vy > 0) {
          score += (1 + streak);
          streak++;
          document.getElementById('scoreText').textContent = score;
          document.getElementById('streakText').textContent = `x${streak}`;
          setTimeout(resetBall, 600);
        }

        // Rebote en tablero
        if (ball.x + ball.r > hoopX + 70 && ball.x - ball.r < hoopX + 85 && ball.y > hoopY - 80 && ball.y < hoopY + 20) {
          ball.vx = -ball.vx * 0.6;
        }

        // Fuera de pantalla
        if (ball.y > height + 50 || ball.x > width + 50) {
          streak = 0;
          document.getElementById('streakText').textContent = `x0`;
          resetBall();
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      const hoopX = width * 0.78;
      const hoopY = height * 0.42;

      // 1. Tablero y Aro de Baloncesto
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.fillRect(hoopX + 70, hoopY - 80, 14, 90);
      ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 4; ctx.strokeRect(hoopX + 70, hoopY - 80, 14, 90);

      // Aro
      ctx.strokeStyle = '#ea580c';
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(hoopX, hoopY); ctx.lineTo(hoopX + 70, hoopY); ctx.stroke();

      // Red
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(hoopX, hoopY); ctx.lineTo(hoopX + 15, hoopY + 45); ctx.lineTo(hoopX + 55, hoopY + 45); ctx.lineTo(hoopX + 70, hoopY);
      ctx.stroke();

      // 2. Guía de tiro
      if (isAiming && !ball.shot) {
        const dx = aimStart.x - aimCurrent.x;
        const dy = aimStart.y - aimCurrent.y;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 8]);
        ctx.beginPath();
        ctx.moveTo(ball.x, ball.y);
        ctx.lineTo(ball.x + dx, ball.y + dy);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // 3. Pelota de Baloncesto
      ctx.fillStyle = '#ea580c';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r * 0.7, 0, Math.PI); ctx.stroke();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    resetBall();
    loop();
  </script>
</body>
</html>
