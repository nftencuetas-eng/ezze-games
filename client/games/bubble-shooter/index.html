<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bubble Shooter Pop World - ezze.games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; font-family: 'Bungee', cursive; }
    body { background: #0369a1; color: #fff; width: 100vw; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    #canvasWrap { position: relative; width: 100%; height: 100%; max-width: 440px; max-height: 700px; box-shadow: 0 0 40px rgba(0,0,0,0.6); }
    canvas { width: 100%; height: 100%; display: block; background: linear-gradient(180deg, #075985 0%, #0c4a6e 100%); cursor: crosshair; }
    .hud { position: absolute; top: 14px; left: 16px; right: 16px; display: flex; justify-content: space-between; font-size: 16px; color: #facc15; z-index: 10; pointer-events: none; }
    .overlay { position: absolute; inset: 0; background: rgba(12, 74, 110, 0.92); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 20px; z-index: 20; }
    .overlay.hidden { display: none; }
    .btn-play { background: #facc15; color: #000; font-family: 'Bungee'; font-size: 20px; padding: 14px 36px; border: none; border-radius: 14px; cursor: pointer; box-shadow: 0 6px 0 #ca8a04; }
  </style>
</head>
<body>
  <div id="canvasWrap">
    <div class="hud">
      <div>🔮 PUNTOS: <span id="scoreText">0</span></div>
      <div>BURBUJAS: <span id="bubbleCount">30</span></div>
    </div>
    <canvas id="bubbleCanvas" width="360" height="560"></canvas>
    <div class="overlay" id="startScreen">
      <h1 style="font-size: 36px; color: #facc15; text-shadow: 0 0 20px rgba(250, 204, 21, 0.6);">BUBBLE SHOOTER</h1>
      <p style="font-family: 'Outfit'; font-size: 16px; color: #e0f2fe;">¡Apunta y dispara para juntar 3 o más burbujas del mismo color!</p>
      <button class="btn-play" onclick="startGame()">¡A JUGAR!</button>
    </div>
    <div class="overlay hidden" id="gameOverScreen">
      <h1 style="font-size: 34px; color: #facc15;">🎉 ¡NIVEL COMPLETADO! 🎉</h1>
      <p style="font-family: 'Outfit'; font-size: 18px; color: #bae6fd;">Puntos: <strong id="finalScore" style="color: #facc15;">0</strong></p>
      <button class="btn-play" onclick="startGame()">JUGAR DE NUEVO</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('bubbleCanvas');
    const ctx = canvas.getContext('2d');

    const COLORS = ['#ef4444', '#3b82f6', '#22c55e', '#facc15', '#a855f7'];
    const RADIUS = 18;
    const COLS = 10;
    const ROWS = 6;

    let grid = [];
    let currentBubble = null;
    let score = 0;
    let shotsLeft = 30;
    let isPlaying = false;
    let aimAngle = -Math.PI / 2;

    let audioCtx = null;
    function playPop() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
      } catch(e){}
    }

    function startGame() {
      grid = [];
      for (let r = 0; r < ROWS; r++) {
        grid[r] = [];
        for (let c = 0; c < COLS; c++) {
          grid[r][c] = COLORS[Math.floor(Math.random() * COLORS.length)];
        }
      }

      score = 0;
      shotsLeft = 30;
      isPlaying = true;
      document.getElementById('scoreText').textContent = '0';
      document.getElementById('bubbleCount').textContent = '30';
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');

      spawnShooter();
    }

    function spawnShooter() {
      currentBubble = {
        x: canvas.width / 2,
        y: canvas.height - 40,
        vx: 0, vy: 0,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        moving: false
      };
    }

    function shoot() {
      if (!isPlaying || currentBubble.moving) return;
      currentBubble.moving = true;
      currentBubble.vx = Math.cos(aimAngle) * 9;
      currentBubble.vy = Math.sin(aimAngle) * 9;
      shotsLeft--;
      document.getElementById('bubbleCount').textContent = shotsLeft;
      playPop();
    }

    function update() {
      if (!isPlaying || !currentBubble || !currentBubble.moving) return;

      currentBubble.x += currentBubble.vx;
      currentBubble.y += currentBubble.vy;

      // Rebote paredes
      if (currentBubble.x - RADIUS < 0 || currentBubble.x + RADIUS > canvas.width) {
        currentBubble.vx *= -1;
      }

      // Llegada arriba
      if (currentBubble.y - RADIUS < 50) {
        currentBubble.moving = false;
        score += 50;
        document.getElementById('scoreText').textContent = score;
        spawnShooter();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Techo de burbujas
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r] && grid[r][c]) {
            const bx = c * (RADIUS * 2) + RADIUS;
            const by = r * (RADIUS * 1.8) + RADIUS + 40;
            ctx.fillStyle = grid[r][c];
            ctx.beginPath(); ctx.arc(bx, by, RADIUS - 1, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2; ctx.stroke();
          }
        }
      }

      // Línea de apuntado
      if (currentBubble && !currentBubble.moving) {
        ctx.strokeStyle = 'rgba(250, 204, 21, 0.6)';
        ctx.lineWidth = 3;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, canvas.height - 40);
        ctx.lineTo(canvas.width / 2 + Math.cos(aimAngle) * 120, canvas.height - 40 + Math.sin(aimAngle) * 120);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Burbuja cañón
      if (currentBubble) {
        ctx.fillStyle = currentBubble.color;
        ctx.beginPath(); ctx.arc(currentBubble.x, currentBubble.y, RADIUS, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
      }
    }

    function handleAim(cx, cy) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (cx - rect.left) * scaleX;
      const y = (cy - rect.top) * scaleY;
      aimAngle = Math.atan2(y - (canvas.height - 40), x - (canvas.width / 2));
      aimAngle = Math.min(-0.2, Math.max(-Math.PI + 0.2, aimAngle));
    }

    canvas.addEventListener('mousemove', e => handleAim(e.clientX, e.clientY));
    canvas.addEventListener('click', shoot);
    canvas.addEventListener('touchmove', e => {
      if (e.touches.length > 0) handleAim(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    canvas.addEventListener('touchend', shoot);

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
