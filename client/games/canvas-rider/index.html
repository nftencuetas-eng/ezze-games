<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Canvas Rider: Bike Stunts - ezze.games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; font-family: 'Bungee', cursive; }
    body { background: #0f172a; color: #fff; width: 100vw; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    #canvasWrap { position: relative; width: 100%; height: 100%; }
    canvas { width: 100%; height: 100%; display: block; background: #f8fafc; }
    .hud { position: absolute; top: 16px; left: 20px; right: 20px; display: flex; justify-content: space-between; font-size: 16px; color: #0f172a; z-index: 10; pointer-events: none; }
    .hud-pill { background: rgba(15, 23, 42, 0.85); border: 2px solid #3b82f6; padding: 6px 14px; border-radius: 12px; color: #fff; }
    .touch-bar { position: absolute; bottom: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 20; pointer-events: none; }
    .t-grp { display: flex; gap: 12px; pointer-events: auto; }
    .t-btn { width: 64px; height: 64px; border-radius: 50%; background: rgba(15, 23, 42, 0.85); border: 2px solid #fff; color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center; }
    .t-btn:active { background: #3b82f6; }
    .overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px; z-index: 30; }
    .overlay.hidden { display: none; }
    .btn-play { background: #3b82f6; color: #fff; font-family: 'Bungee'; font-size: 20px; padding: 14px 36px; border: none; border-radius: 14px; cursor: pointer; box-shadow: 0 6px 0 #1d4ed8; }
  </style>
</head>
<body>
  <div id="canvasWrap">
    <div class="hud">
      <div class="hud-pill">⏱️ TIEMPO: <span id="timerText" style="color:#facc15;">0.0s</span></div>
      <div class="hud-pill">DISTANCIA: <span id="distText">0</span>m</div>
    </div>
    <canvas id="bikeCanvas"></canvas>
    <div class="touch-bar">
      <div class="t-grp">
        <button class="t-btn" id="btnTiltL">↺</button>
        <button class="t-btn" id="btnTiltR">↻</button>
      </div>
      <div class="t-grp">
        <button class="t-btn" style="background: rgba(239, 68, 68, 0.8);" id="btnBrake">▼</button>
        <button class="t-btn" style="background: rgba(16, 185, 129, 0.8); width: 72px; height: 72px;" id="btnGas">GAS</button>
      </div>
    </div>
    <div class="overlay" id="startScreen">
      <h1 style="font-size: 40px; color: #3b82f6;">CANVAS RIDER</h1>
      <p style="font-family: 'Outfit'; font-size: 16px; color: #94a3b8;">¡Acelera y haz piruetas en las pistas dibujadas a mano!</p>
      <button class="btn-play" id="btnStart">COMENZAR CARRERA</button>
    </div>
    <div class="overlay hidden" id="winScreen">
      <h1 style="font-size: 38px; color: #10b981;">🏁 ¡META ALCANZADA! 🏁</h1>
      <p style="font-family: 'Outfit'; font-size: 18px; color: #cbd5e1;">Tiempo récord: <strong id="winTime" style="color: #3b82f6;">0.0s</strong></p>
      <button class="btn-play" id="btnRestart">CORRER DE NUEVO</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('bikeCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    let bike = { x: 100, y: 300, vx: 0, vy: 0, angle: 0, angVel: 0 };
    let points = [];
    let isPlaying = false;
    let time = 0;
    let finishX = 2800;

    function generateTrack() {
      points = [];
      let x = 0, y = 400;
      for (let i = 0; i < 150; i++) {
        points.push({ x, y });
        x += 40;
        if (i > 10 && i < 22) y = 400 - Math.sin((i - 10) * 0.4) * 120; // Rampa salto
        else if (i > 30 && i < 45) y = 400 + Math.sin((i - 30) * 0.4) * 80; // Valle
        else if (i > 55 && i < 75) y = 360 - Math.sin((i - 55) * 0.3) * 180; // Gran Colina
        else y = 400 + Math.sin(i * 0.3) * 20;
      }
      finishX = x - 200;
    }

    function startRace() {
      generateTrack();
      bike = { x: 100, y: 300, vx: 0, vy: 0, angle: 0, angVel: 0 };
      time = 0;
      isPlaying = true;
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('winScreen').classList.add('hidden');
    }

    function getGroundY(x) {
      for (let i = 0; i < points.length - 1; i++) {
        if (x >= points[i].x && x <= points[i + 1].x) {
          const t = (x - points[i].x) / (points[i + 1].x - points[i].x);
          return points[i].y + t * (points[i + 1].y - points[i].y);
        }
      }
      return 500;
    }

    let keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    const bindT = (id, k) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[k] = true; });
      el.addEventListener('touchend', (e) => { e.preventDefault(); keys[k] = false; });
      el.addEventListener('mousedown', () => keys[k] = true);
      el.addEventListener('mouseup', () => keys[k] = false);
    };
    bindT('btnGas', 'ArrowUp');
    bindT('btnBrake', 'ArrowDown');
    bindT('btnTiltL', 'ArrowLeft');
    bindT('btnTiltR', 'ArrowRight');

    function update() {
      if (!isPlaying) return;

      time += 1 / 60;
      document.getElementById('timerText').textContent = time.toFixed(1) + 's';
      document.getElementById('distText').textContent = Math.floor(bike.x / 10);

      const isGas = keys['ArrowUp'] || keys['KeyW'];
      const isBrake = keys['ArrowDown'] || keys['KeyS'];
      const isLeft = keys['ArrowLeft'] || keys['KeyA'];
      const isRight = keys['ArrowRight'] || keys['KeyD'];

      bike.vy += 0.42; // Gravedad
      bike.x += bike.vx;
      bike.y += bike.vy;
      bike.angle += bike.angVel;
      bike.angVel *= 0.92;

      const groundY = getGroundY(bike.x);

      if (bike.y + 16 >= groundY) {
        bike.y = groundY - 16;
        bike.vy = 0;

        if (isGas) bike.vx += 0.4;
        if (isBrake) bike.vx *= 0.94;
        bike.vx *= 0.985;
      } else {
        if (isLeft) bike.angVel -= 0.007;
        if (isRight) bike.angVel += 0.007;
      }

      // Meta
      if (bike.x > finishX) {
        isPlaying = false;
        document.getElementById('winTime').textContent = time.toFixed(1) + 's';
        document.getElementById('winScreen').classList.remove('hidden');
      }

      // Caída al vacío
      if (bike.y > height + 400) {
        startRace();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      const camX = bike.x - width * 0.35;
      const camY = bike.y - height * 0.55;

      ctx.save();
      ctx.translate(-camX, -camY);

      // Pista dibujada
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 4;
      ctx.beginPath();
      if (points.length > 0) {
        ctx.moveTo(points[0].x, points[0].y);
        points.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.stroke();
      }

      // Bandera de Meta
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(finishX, getGroundY(finishX) - 60, 30, 20);
      ctx.fillStyle = '#000';
      ctx.fillRect(finishX, getGroundY(finishX) - 60, 4, 60);

      // Bicicleta y Ciclista
      ctx.save();
      ctx.translate(bike.x, bike.y);
      ctx.rotate(bike.angle);

      // Ruedas
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(-18, 10, 10, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(18, 10, 10, 0, Math.PI * 2); ctx.stroke();

      // Cuadro
      ctx.beginPath();
      ctx.moveTo(-18, 10); ctx.lineTo(0, 2); ctx.lineTo(18, 10);
      ctx.moveTo(0, 2); ctx.lineTo(-4, -10); ctx.lineTo(8, -8);
      ctx.stroke();

      // Ciclista Stickman
      ctx.fillStyle = '#0f172a';
      ctx.beginPath(); ctx.arc(2, -18, 6, 0, Math.PI * 2); ctx.fill(); // Cabeza
      ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(-4, -2); ctx.stroke(); // Tronco

      ctx.restore();
      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    document.getElementById('btnStart').addEventListener('click', startRace);
    document.getElementById('btnRestart').addEventListener('click', startRace);

    loop();
  </script>
</body>
</html>
