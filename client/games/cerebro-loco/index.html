<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cerebro Loco: Acertijos Tramposos - ezze.games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/orientation.css">
  <style>
    :root {
      --primary: #f59e0b;
      --accent: #10b981;
      --bg: #0f172a;
      --card-bg: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: var(--bg);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
    }

    #gameContainer {
      position: relative;
      width: 800px;
      height: 520px;
      max-width: 96vw;
      max-height: 92vh;
      background: #f8fafc;
      border: 4px solid var(--primary);
      border-radius: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(245, 158, 11, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* TOP BAR */
    .top-bar {
      background: #ffffff;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e2e8f0;
      z-index: 10;
    }

    .level-indicator {
      font-family: 'Bungee', cursive;
      font-size: 20px;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-actions {
      display: flex;
      gap: 10px;
    }

    .btn-action {
      background: #f1f5f9;
      border: 2px solid #cbd5e1;
      color: #0f172a;
      font-family: 'Bungee', cursive;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-action:hover {
      background: #e2e8f0;
      transform: translateY(-2px);
    }

    .btn-hint {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-color: #b45309;
      color: #fff;
      box-shadow: 0 4px 0 #92400e;
    }

    .btn-hint:hover {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
    }

    /* PREGUNTA PRINCIPAL */
    .question-header {
      background: #ffffff;
      padding: 14px 24px;
      text-align: center;
      font-family: 'Bungee', cursive;
      font-size: 22px;
      color: #1e293b;
      border-bottom: 1px solid #e2e8f0;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ÁREA DE JUEGO INTERACTIVA */
    #puzzleArea {
      flex: 1;
      position: relative;
      background: #f1f5f9;
      overflow: hidden;
    }

    /* ELEMENTOS ARRASTRABLES Y CLICKEABLES */
    .drag-item {
      position: absolute;
      cursor: grab;
      touch-action: none;
      transition: transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .drag-item:active {
      cursor: grabbing;
      transform: scale(1.08);
      z-index: 100;
    }

    .click-item {
      position: absolute;
      cursor: pointer;
      transition: transform 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .click-item:hover {
      transform: scale(1.08);
    }

    .click-item:active {
      transform: scale(0.95);
    }

    /* POPUP DE PISTA */
    .hint-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .hint-modal.hidden {
      display: none;
    }

    .hint-box {
      background: #fff;
      border: 4px solid var(--primary);
      border-radius: 20px;
      padding: 24px 32px;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .hint-box h3 {
      font-family: 'Bungee', cursive;
      color: var(--primary);
      font-size: 24px;
    }

    .hint-box p {
      color: #334155;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.5;
    }

    .btn-close-hint {
      background: var(--primary);
      color: #fff;
      font-family: 'Bungee', cursive;
      font-size: 14px;
      padding: 10px 24px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    /* MODAL DE ÉXITO */
    .success-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
    }

    .success-modal.hidden {
      display: none;
    }

    .success-box {
      background: #fff;
      border: 4px solid var(--accent);
      border-radius: 24px;
      padding: 28px 36px;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      animation: popSuccess 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popSuccess {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .success-box h2 {
      font-family: 'Bungee', cursive;
      color: var(--accent);
      font-size: 28px;
    }

    .success-box p {
      color: #475569;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.5;
    }

    .btn-next-level {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      font-family: 'Bungee', cursive;
      font-size: 16px;
      padding: 12px 30px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 6px 0 #047857;
      transition: all 0.1s ease;
      width: 100%;
    }

    .btn-next-level:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #047857;
    }

    /* CONFETTI CANVAS */
    #confettiCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 250;
    }
  </style>
</head>
<body>

  <div id="gameContainer">
    <canvas id="confettiCanvas"></canvas>

    <!-- BARRA SUPERIOR -->
    <div class="top-bar">
      <div class="level-indicator">
        <span>🧠</span> <span id="levelLabel">NIVEL 1</span>
      </div>
      <div class="top-actions">
        <button class="btn-action btn-hint" id="btnHint">💡 PISTA</button>
        <button class="btn-action" id="btnReset">🔄 REINICIAR</button>
      </div>
    </div>

    <!-- PREGUNTA / ENUNCIADO -->
    <div class="question-header" id="questionText">
      ¡Haz florecer la flor marchita!
    </div>

    <!-- ÁREA DE JUEGO INTERACTIVA -->
    <div id="puzzleArea">
      <!-- Los elementos interactivos se inyectan dinámicamente -->
    </div>

    <!-- MODAL DE PISTA -->
    <div class="hint-modal hidden" id="hintModal">
      <div class="hint-box">
        <h3>💡 PISTA</h3>
        <p id="hintText">Arrastra la nube que tapa el sol.</p>
        <button class="btn-close-hint" id="btnCloseHint">¡ENTENDIDO!</button>
      </div>
    </div>

    <!-- MODAL DE ÉXITO -->
    <div class="success-modal hidden" id="successModal">
      <div class="success-box">
        <span style="font-size: 54px;">🎉</span>
        <h2>¡ACERTASTE!</h2>
        <p id="explanationText">¡Pensaste fuera de la caja!</p>
        <button class="btn-next-level" id="btnNextLevel">SIGUIENTE NIVEL ▶</button>
      </div>
    </div>
  </div>

  <script src="../../js/orientation.js"></script>
  <script>
    new OrientationLock({
      requiresLandscape: true,
      onOrientationChange: () => window.dispatchEvent(new Event('resize'))
    });
    /**
     * MOTOR DE AUDIO PROCEDURAL
     */
    class SoundFx {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) {
          const C = window.AudioContext || window.webkitAudioContext;
          if (C) this.ctx = new C();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playPop() {
        if (!this.ctx) return;
        this.init();
        const now = this.ctx.currentTime;
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(400, now);
        o.frequency.exponentialRampToValueAtTime(800, now + 0.1);
        g.gain.setValueAtTime(0.3, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(now); o.stop(now + 0.13);
      }
      playWin() {
        if (!this.ctx) return;
        this.init();
        [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
          const now = this.ctx.currentTime + i * 0.09;
          const o = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o.type = 'triangle';
          o.frequency.setValueAtTime(f, now);
          g.gain.setValueAtTime(0.25, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          o.connect(g); g.connect(this.ctx.destination);
          o.start(now); o.stop(now + 0.4);
        });
      }
      playError() {
        if (!this.ctx) return;
        this.init();
        const now = this.ctx.currentTime;
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(150, now);
        o.frequency.linearRampToValueAtTime(90, now + 0.2);
        g.gain.setValueAtTime(0.25, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(now); o.stop(now + 0.23);
      }
    }

    const sound = new SoundFx();

    /**
     * EFECTO CONFETTI
     */
    const confCanvas = document.getElementById('confettiCanvas');
    const confCtx = confCanvas.getContext('2d');
    let confetti = [];

    function resizeConfetti() {
      confCanvas.width = confCanvas.parentElement.clientWidth;
      confCanvas.height = confCanvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeConfetti);
    resizeConfetti();

    function fireConfetti() {
      confetti = [];
      const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#ef4444'];
      for (let i = 0; i < 60; i++) {
        confetti.push({
          x: confCanvas.width / 2,
          y: confCanvas.height / 2,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.7) * 14,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          life: 80
        });
      }
    }

    function updateConfetti() {
      confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height);
      for (let i = confetti.length - 1; i >= 0; i--) {
        const c = confetti[i];
        c.x += c.vx;
        c.y += c.vy;
        c.vy += 0.35; // Gravedad
        c.life--;
        confCtx.fillStyle = c.color;
        confCtx.fillRect(c.x, c.y, c.size, c.size);
        if (c.life <= 0) confetti.splice(i, 1);
      }
      requestAnimationFrame(updateConfetti);
    }
    updateConfetti();

    /**
     * DEFINICIÓN DE LOS 9 ACERTIJOS ORIGINALES
     */
    const PUZZLES = [
      {
        id: 1,
        title: "¡Haz florecer la flor marchita!",
        hint: "El sol está detrás de la nube oscura. ¡Arrastra la nube lejos!",
        explanation: "¡Exacto! El sol y el agua hicieron florecer la hermosa flor 🌸",
        setup: (area, win) => {
          // Sol fijo
          const sun = createElem('div', 'click-item', '☀️', { left: '48%', top: '60px', fontSize: '70px' });
          // Nube que tapa el sol
          const cloud = createElem('div', 'drag-item', '☁️', { left: '46%', top: '50px', fontSize: '90px' });
          // Flor en maceta
          const flower = createElem('div', 'click-item', '🥀', { left: '47%', top: '240px', fontSize: '80px' });
          // Regadera
          const can = createElem('div', 'drag-item', '🫗', { left: '20%', top: '220px', fontSize: '60px' });

          let sunExposed = false;
          let watered = false;

          makeDraggable(cloud, (x, y) => {
            if (x < 200 || x > 500) {
              sunExposed = true;
              check();
            }
          });

          makeDraggable(can, (x, y) => {
            if (Math.abs(x - 360) < 60 && Math.abs(y - 200) < 60) {
              watered = true;
              can.textContent = '💧';
              check();
            }
          });

          function check() {
            if (sunExposed && watered) {
              flower.textContent = '🌸';
              flower.style.transform = 'scale(1.3)';
              setTimeout(win, 600);
            }
          }

          area.append(sun, cloud, flower, can);
        }
      },
      {
        id: 2,
        title: "¿Cuántas manzanas hay en el árbol?",
        hint: "¡Las manzanas están bien agarradas! Haz clic varias veces en el árbol para sacudirlo.",
        explanation: "¡Había 4 manzanas ocultas entre las ramas! En total eran 7 🍎",
        setup: (area, win) => {
          const tree = createElem('div', 'click-item', '🌳', { left: '40%', top: '40px', fontSize: '180px' });
          
          let count = 3;
          const apples = [];
          
          // 3 manzanas visibles
          for (let i = 0; i < 3; i++) {
            const a = createElem('div', 'click-item', '🍎', { left: `${42 + i * 8}%`, top: `${130 + (i%2)*30}px`, fontSize: '36px' });
            apples.push(a);
            area.append(a);
          }

          let clicks = 0;
          tree.addEventListener('click', () => {
            sound.playPop();
            clicks++;
            tree.style.transform = `scale(1.05) rotate(${clicks % 2 === 0 ? 5 : -5}deg)`;
            setTimeout(() => tree.style.transform = 'scale(1)', 150);

            if (clicks === 3) {
              // Caen 4 manzanas más
              for (let i = 0; i < 4; i++) {
                const a = createElem('div', 'click-item', '🍎', { left: `${36 + i * 10}%`, top: '120px', fontSize: '36px' });
                area.append(a);
                a.style.transition = 'top 0.5s ease';
                setTimeout(() => a.style.top = `${280 + (i%2)*20}px`, 50);
              }
            }
          });

          // Botones de respuesta
          const btnBox = createElem('div', '', '', { bottom: '20px', left: '0', right: '0', display: 'flex', justifyContent: 'center', gap: '16px' });
          [3, 5, 7, 9].forEach(num => {
            const btn = document.createElement('button');
            btn.className = 'btn-action';
            btn.style.fontSize = '20px';
            btn.style.padding = '12px 24px';
            btn.textContent = num;
            btn.addEventListener('click', () => {
              if (num === 7 && clicks >= 3) {
                win();
              } else {
                sound.playError();
                btn.style.borderColor = '#ef4444';
              }
            });
            btnBox.appendChild(btn);
          });

          area.append(tree, btnBox);
        }
      },
      {
        id: 3,
        title: "¡Alimenta al gato glotón con su pescado!",
        hint: "La pecera tiene candado. ¡Mira detrás del cuadro en la pared!",
        explanation: "¡Encontraste la llave secreta detrás del cuadro! 🐱🐟",
        setup: (area, win) => {
          const cat = createElem('div', 'click-item', '🐱', { left: '15%', top: '180px', fontSize: '90px' });
          const bowl = createElem('div', 'click-item', '🔒🐟', { left: '70%', top: '200px', fontSize: '70px' });
          const key = createElem('div', 'drag-item', '🗝️', { left: '46%', top: '90px', fontSize: '40px', zIndex: 1 });
          const painting = createElem('div', 'drag-item', '🖼️', { left: '44%', top: '70px', fontSize: '90px', zIndex: 2 });

          let unlocked = false;

          makeDraggable(painting, (x, y) => {
            // Mover cuadro revela llave
          });

          makeDraggable(key, (x, y) => {
            if (Math.abs(x - 520) < 60 && Math.abs(y - 180) < 60 && !unlocked) {
              unlocked = true;
              sound.playPop();
              key.remove();
              bowl.textContent = '🐟';
              makeDraggable(bowl, (bx, by) => {
                if (Math.abs(bx - 120) < 80) {
                  cat.textContent = '😻';
                  setTimeout(win, 500);
                }
              });
            }
          });

          area.append(cat, bowl, key, painting);
        }
      },
      {
        id: 4,
        title: "¡Ayuda al coche a cruzar el precipicio!",
        hint: "El puente está roto. Arrastra la roca grande para rellenar el agujero.",
        explanation: "¡Construiste un puente perfecto con la roca! 🚗💨",
        setup: (area, win) => {
          // Precipicio
          const cliffL = createElem('div', '', '', { left: '0', top: '260px', width: '220px', height: '120px', background: '#334155', borderRadius: '0 12px 0 0' });
          const cliffR = createElem('div', '', '', { right: '0', top: '260px', width: '380px', height: '120px', background: '#334155', borderRadius: '12px 0 0 0' });
          
          const car = createElem('div', 'click-item', '🏎️', { left: '20px', top: '205px', fontSize: '65px' });
          const rock = createElem('div', 'drag-item', '🪨', { left: '600px', top: '80px', fontSize: '80px' });

          let bridgeRepaired = false;

          makeDraggable(rock, (x, y) => {
            if (x > 210 && x < 380 && y > 220) {
              bridgeRepaired = true;
              rock.style.left = '230px';
              rock.style.top = '245px';
            }
          });

          car.addEventListener('click', () => {
            sound.playPop();
            car.style.transition = 'left 1.2s ease-in-out';
            if (bridgeRepaired) {
              car.style.left = '650px';
              setTimeout(win, 1300);
            } else {
              car.style.left = '200px';
              setTimeout(() => {
                car.style.transform = 'rotate(45deg)';
                car.style.top = '380px';
                sound.playError();
              }, 400);
            }
          });

          area.append(cliffL, cliffR, rock, car);
        }
      },
      {
        id: 5,
        title: "¡Despierta al búho dormilón!",
        hint: "Los búhos solo despiertan de noche. Arrastra el sol hacia abajo de la pantalla.",
        explanation: "¡Hiciste la noche y el búho abrió sus ojos gigantes! 🦉🌙",
        setup: (area, win) => {
          const sun = createElem('div', 'drag-item', '☀️', { left: '65%', top: '60px', fontSize: '80px' });
          const tree = createElem('div', 'click-item', '🌲', { left: '15%', top: '80px', fontSize: '180px' });
          const owl = createElem('div', 'click-item', '😴', { left: '22%', top: '150px', fontSize: '60px' });

          makeDraggable(sun, (x, y) => {
            if (y > 320) {
              area.style.background = '#090d16';
              sun.style.display = 'none';
              const moon = createElem('div', '', '🌙', { left: '65%', top: '60px', fontSize: '70px' });
              area.append(moon);
              owl.textContent = '🦉';
              owl.style.transform = 'scale(1.3)';
              setTimeout(win, 700);
            }
          });

          area.append(sun, tree, owl);
        }
      },
      {
        id: 6,
        title: "¡Encuentra el trébol de 4 hojas de la suerte!",
        hint: "Todos tienen 3 hojas... ¡Arrastra una hoja de un trébol hacia otro para unirla!",
        explanation: "¡Creaste tu propia suerte con un trébol de 4 hojas! 🍀✨",
        setup: (area, win) => {
          const c1 = createElem('div', 'click-item', '☘️', { left: '20%', top: '140px', fontSize: '90px' });
          const c2 = createElem('div', 'click-item', '☘️', { left: '60%', top: '140px', fontSize: '90px' });
          const extraLeaf = createElem('div', 'drag-item', '🍃', { left: '25%', top: '160px', fontSize: '45px' });

          makeDraggable(extraLeaf, (x, y) => {
            if (Math.abs(x - 440) < 80 && Math.abs(y - 120) < 80) {
              extraLeaf.remove();
              c2.textContent = '🍀';
              c2.style.transform = 'scale(1.4)';
              setTimeout(win, 600);
            }
          });

          area.append(c1, c2, extraLeaf);
        }
      },
      {
        id: 7,
        title: "¡Apaga el volcán en erupción!",
        hint: "Arrastra la nube de lluvia sobre el volcán y tira el cubito de hielo al cráter.",
        explanation: "¡El hielo y la lluvia congelaron el volcán por completo! 🧊🌋",
        setup: (area, win) => {
          const volcano = createElem('div', '', '🌋', { left: '38%', top: '140px', fontSize: '170px' });
          const cloud = createElem('div', 'drag-item', '🌧️', { left: '10%', top: '60px', fontSize: '80px' });
          const ice = createElem('div', 'drag-item', '🧊', { left: '75%', top: '220px', fontSize: '60px' });

          let cloudOver = false;
          let iceIn = false;

          makeDraggable(cloud, (x, y) => {
            if (Math.abs(x - 300) < 70 && y < 140) {
              cloudOver = true;
              check();
            }
          });

          makeDraggable(ice, (x, y) => {
            if (Math.abs(x - 300) < 70 && y < 180) {
              iceIn = true;
              ice.remove();
              check();
            }
          });

          function check() {
            if (cloudOver && iceIn) {
              volcano.textContent = '🏔️';
              setTimeout(win, 600);
            }
          }

          area.append(volcano, cloud, ice);
        }
      },
      {
        id: 8,
        title: "¿Cuál animal es el más grande en la realidad?",
        hint: "No te dejes engañar por el dibujo. ¡La ballena azul es el más gigante!",
        explanation: "¡Exacto! La Ballena Azul es el animal más grande del planeta 🐋",
        setup: (area, win) => {
          const animals = [
            { name: 'Ratón', icon: '🐭', size: 110, correct: false, left: '15%', top: '60px' },
            { name: 'Elefante', icon: '🐘', size: 60, correct: false, left: '55%', top: '70px' },
            { name: 'León', icon: '🦁', size: 90, correct: false, left: '20%', top: '200px' },
            { name: 'Ballena', icon: '🐋', size: 50, correct: true, left: '60%', top: '210px' }
          ];

          animals.forEach(a => {
            const el = createElem('div', 'click-item', a.icon, { left: a.left, top: a.top, fontSize: `${a.size}px` });
            el.addEventListener('click', () => {
              if (a.correct) {
                el.style.transform = 'scale(1.8)';
                win();
              } else {
                sound.playError();
                el.style.transform = 'scale(0.8)';
                setTimeout(() => el.style.transform = 'scale(1)', 200);
              }
            });
            area.append(el);
          });
        }
      },
      {
        id: 9,
        title: "¡Abre la gran caja sorpresa final!",
        hint: "El lazo está apretado. Arrastra la tijera dorada para cortar la cinta.",
        explanation: "¡GANASTE EL JUEGO COMPLETO! Eres una Mente Maestra 🧠👑",
        setup: (area, win) => {
          const box = createElem('div', 'click-item', '🎁', { left: '38%', top: '120px', fontSize: '170px' });
          const scissors = createElem('div', 'drag-item', '✂️', { left: '15%', top: '180px', fontSize: '70px' });

          makeDraggable(scissors, (x, y) => {
            if (Math.abs(x - 280) < 80 && Math.abs(y - 140) < 80) {
              scissors.remove();
              box.textContent = '👑✨';
              box.style.transform = 'scale(1.3)';
              setTimeout(win, 600);
            }
          });

          area.append(box, scissors);
        }
      }
    ];

    /**
     * GESTOR DEL ESTADO
     */
    let currentIdx = 0;
    const area = document.getElementById('puzzleArea');
    const qText = document.getElementById('questionText');
    const lvlLabel = document.getElementById('levelLabel');

    function loadPuzzle(idx) {
      currentIdx = idx;
      area.innerHTML = '';
      area.style.background = '#f1f5f9';

      const p = PUZZLES[idx];
      lvlLabel.textContent = `NIVEL ${p.id}`;
      qText.textContent = p.title;

      p.setup(area, () => {
        sound.playWin();
        fireConfetti();
        document.getElementById('explanationText').textContent = p.explanation;
        document.getElementById('successModal').classList.remove('hidden');
      });
    }

    document.getElementById('btnNextLevel').addEventListener('click', () => {
      document.getElementById('successModal').classList.add('hidden');
      if (currentIdx < PUZZLES.length - 1) {
        loadPuzzle(currentIdx + 1);
      } else {
        alert('🎉 ¡Completaste todos los acertijos de Cerebro Loco!');
        loadPuzzle(0);
      }
    });

    document.getElementById('btnHint').addEventListener('click', () => {
      sound.playPop();
      document.getElementById('hintText').textContent = PUZZLES[currentIdx].hint;
      document.getElementById('hintModal').classList.remove('hidden');
    });

    document.getElementById('btnCloseHint').addEventListener('click', () => {
      document.getElementById('hintModal').classList.add('hidden');
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      sound.playPop();
      loadPuzzle(currentIdx);
    });

    /**
     * HELPERS DE ARRASTRE Y DOM
     */
    function createElem(tag, className, text, styles = {}) {
      const el = document.createElement(tag || 'div');
      if (className) el.className = className;
      if (text) el.textContent = text;
      Object.assign(el.style, styles);
      return el;
    }

    function makeDraggable(el, onDrop) {
      let isDrag = false;
      let startX, startY, origX, origY;

      const onStart = (cx, cy) => {
        sound.init();
        isDrag = true;
        startX = cx;
        startY = cy;
        origX = el.offsetLeft;
        origY = el.offsetTop;
      };

      const onMove = (cx, cy) => {
        if (!isDrag) return;
        const dx = cx - startX;
        const dy = cy - startY;
        el.style.left = `${origX + dx}px`;
        el.style.top = `${origY + dy}px`;
      };

      const onEnd = () => {
        if (!isDrag) return;
        isDrag = false;
        if (onDrop) onDrop(el.offsetLeft, el.offsetTop);
      };

      el.addEventListener('mousedown', e => onStart(e.clientX, e.clientY));
      window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
      window.addEventListener('mouseup', onEnd);

      el.addEventListener('touchstart', e => {
        if (e.touches.length > 0) onStart(e.touches[0].clientX, e.touches[0].clientY);
      });
      window.addEventListener('touchmove', e => {
        if (e.touches.length > 0) onMove(e.touches[0].clientX, e.touches[0].clientY);
      });
      window.addEventListener('touchend', onEnd);
    }

    // Iniciar
    loadPuzzle(0);
  </script>
</body>
</html>
