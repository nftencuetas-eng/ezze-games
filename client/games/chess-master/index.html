<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chess Grandmaster Pro - ezze.games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Outfit', sans-serif; }
    body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; }
    .header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .header h1 { font-family: 'Bungee'; font-size: 22px; color: #f59e0b; }
    .turn-badge { background: #1e293b; border: 1.5px solid #475569; padding: 6px 14px; border-radius: 10px; font-weight: 800; font-size: 13px; }
    .board-container { width: 100%; max-width: 440px; aspect-ratio: 1; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); border: 4px solid #475569; border-radius: 14px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
    .square { display: flex; align-items: center; justify-content: center; font-size: 34px; cursor: pointer; transition: background 0.1s; }
    .sq-light { background: #e2e8f0; }
    .sq-dark { background: #64748b; }
    .square.selected { background: #fef08a !important; }
    .square.highlight { background: #86efac !important; }
    .btn-row { width: 100%; max-width: 440px; display: flex; justify-content: space-between; margin-top: 12px; }
    .btn-opt { background: #1e293b; border: 1.5px solid #475569; color: #fff; font-weight: 800; padding: 8px 16px; border-radius: 10px; cursor: pointer; }
    .btn-opt.active { background: #3b82f6; border-color: #60a5fa; }
  </style>
</head>
<body>
  <div class="header">
    <h1>CHESS PRO</h1>
    <div class="turn-badge" id="turnBadge">TURNO: ⚪ BLANCAS</div>
  </div>
  <div class="board-container" id="board"></div>
  <div class="btn-row">
    <button class="btn-opt" id="btnVsAI" onclick="toggleAI()">🤖 Modo: vs Computadora</button>
    <button class="btn-opt" onclick="initChess()">🔄 Reiniciar</button>
  </div>

  <script>
    const PIECES = {
      r: '♜', n: '♞', b: '♝', q: '♛', k: '♚', p: '♟',
      R: '♖', N: '♘', B: '♗', Q: '♕', K: '♔', P: '♙'
    };

    const INITIAL_BOARD = [
      ['r','n','b','q','k','b','n','r'],
      ['p','p','p','p','p','p','p','p'],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['P','P','P','P','P','P','P','P'],
      ['R','N','B','Q','K','B','N','R']
    ];

    let board = [];
    let turn = 'w';
    let selected = null;
    let vsAI = true;

    function toggleAI() {
      vsAI = !vsAI;
      document.getElementById('btnVsAI').textContent = vsAI ? '🤖 Modo: vs Computadora' : '👥 Modo: 2 Jugadores';
    }

    function initChess() {
      board = JSON.parse(JSON.stringify(INITIAL_BOARD));
      turn = 'w';
      selected = null;
      document.getElementById('turnBadge').textContent = 'TURNO: ⚪ BLANCAS';
      render();
    }

    function render() {
      const bEl = document.getElementById('board');
      bEl.innerHTML = '';

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sq = document.createElement('div');
          sq.className = `square ${(r + c) % 2 === 0 ? 'sq-light' : 'sq-dark'}`;
          const p = board[r][c];
          if (p) sq.textContent = PIECES[p] || '';

          if (selected && selected.r === r && selected.c === c) sq.classList.add('selected');

          sq.addEventListener('click', () => handleClick(r, c));
          bEl.appendChild(sq);
        }
      }
    }

    function handleClick(r, c) {
      const p = board[r][c];

      if (selected) {
        if (selected.r === r && selected.c === c) {
          selected = null;
        } else {
          // Mover pieza
          board[r][c] = board[selected.r][selected.c];
          board[selected.r][selected.c] = '';
          selected = null;
          turn = turn === 'w' ? 'b' : 'w';
          document.getElementById('turnBadge').textContent = turn === 'w' ? 'TURNO: ⚪ BLANCAS' : 'TURNO: ⚫ NEGRAS';

          if (vsAI && turn === 'b') {
            setTimeout(aiMove, 300);
          }
        }
      } else if (p) {
        const isWhite = p === p.toUpperCase();
        if ((isWhite && turn === 'w') || (!isWhite && turn === 'b')) {
          selected = { r, c };
        }
      }

      render();
    }

    function aiMove() {
      let blackPieces = [];
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = board[r][c];
          if (p && p === p.toLowerCase()) blackPieces.push({ r, c });
        }
      }

      if (blackPieces.length > 0) {
        const p = blackPieces[Math.floor(Math.random() * blackPieces.length)];
        const targetR = Math.min(7, p.r + 1);
        const targetC = Math.max(0, Math.min(7, p.c + (Math.floor(Math.random() * 3) - 1)));

        board[targetR][targetC] = board[p.r][p.c];
        board[p.r][p.c] = '';
        turn = 'w';
        document.getElementById('turnBadge').textContent = 'TURNO: ⚪ BLANCAS';
        render();
      }
    }

    initChess();
  </script>
</body>
</html>
