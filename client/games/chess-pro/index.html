<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chess Grandmaster - ezze.games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/orientation.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { background: #0f172a; color: #fff; font-family: 'Outfit', sans-serif; overflow: hidden; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #boardWrapper { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .top-info { font-family: 'Bungee'; font-size: 20px; color: #f59e0b; display: flex; gap: 16px; align-items: center; }
    .chessboard { display: grid; grid-template-columns: repeat(8, 52px); grid-template-rows: repeat(8, 52px); border: 4px solid #64748b; border-radius: 12px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
    .square { width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; font-size: 36px; cursor: pointer; transition: background 0.15s ease; }
    .sq-white { background: #e2e8f0; }
    .sq-dark { background: #64748b; }
    .square.selected { background: #fef08a !important; }
    .square.highlight { background: #86efac !important; }
  </style>
</head>
<body>
  <div id="boardWrapper">
    <div class="top-info">
      <span>♟️ TURNO: <strong id="turnText" style="color: #fff;">BLANCAS</strong></span>
      <button onclick="initChess()" style="background: #334155; border: 2px solid #64748b; color: #fff; font-family: 'Bungee'; padding: 6px 14px; border-radius: 8px; cursor: pointer;">REINICIAR</button>
    </div>
    <div class="chessboard" id="board"></div>
  </div>

  <script src="../../js/orientation.js"></script>
  <script>
    new OrientationLock({ requiresLandscape: true });

    const PIECES = {
      r: '♜', n: '♞', b: '♝', q: '♛', k: '♚', p: '♟',
      R: '♖', N: '♘', B: '♗', Q: '♕', K: '♔', P: '♙'
    };

    const INITIAL_BOARD = [
      ['r','n','b','q','k','b','n','r'],
      ['p','p','p','p','p','p','p','p'],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['P','P','P','P','P','P','P','P'],
      ['R','N','B','Q','K','B','N','R']
    ];

    let board = [];
    let turn = 'w'; // 'w' o 'b'
    let selected = null;

    function initChess() {
      board = JSON.parse(JSON.stringify(INITIAL_BOARD));
      turn = 'w';
      selected = null;
      document.getElementById('turnText').textContent = 'BLANCAS';
      render();
    }

    function render() {
      const bEl = document.getElementById('board');
      bEl.innerHTML = '';

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sq = document.createElement('div');
          sq.className = `square ${(r + c) % 2 === 0 ? 'sq-white' : 'sq-dark'}`;
          const p = board[r][c];
          if (p) sq.textContent = PIECES[p] || '';

          if (selected && selected.r === r && selected.c === c) {
            sq.classList.add('selected');
          }

          sq.addEventListener('click', () => handleClick(r, c));
          bEl.appendChild(sq);
        }
      }
    }

    function handleClick(r, c) {
      const p = board[r][c];

      if (selected) {
        // Mover pieza
        if (selected.r === r && selected.c === c) {
          selected = null;
        } else {
          board[r][c] = board[selected.r][selected.c];
          board[selected.r][selected.c] = '';
          selected = null;
          turn = turn === 'w' ? 'b' : 'w';
          document.getElementById('turnText').textContent = turn === 'w' ? 'BLANCAS' : 'NEGRAS';
        }
      } else if (p) {
        const isWhite = p === p.toUpperCase();
        if ((isWhite && turn === 'w') || (!isWhite && turn === 'b')) {
          selected = { r, c };
        }
      }

      render();
    }

    initChess();
  </script>
</body>
</html>
