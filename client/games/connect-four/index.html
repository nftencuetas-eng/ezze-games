<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>4 en Línea: Connect Four - ezze.games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Outfit', sans-serif; }
    body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; }
    .header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .header h1 { font-family: 'Bungee'; font-size: 22px; color: #3b82f6; }
    .turn-badge { background: #1e293b; border: 1.5px solid #475569; padding: 6px 14px; border-radius: 10px; font-weight: 800; font-size: 13px; }
    .board { width: 100%; max-width: 440px; aspect-ratio: 7 / 6; background: #1d4ed8; border: 4px solid #1e40af; border-radius: 16px; padding: 10px; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(6, 1fr); gap: 8px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
    .slot { background: #0f172a; border-radius: 50%; aspect-ratio: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
    .slot:hover { transform: scale(1.05); }
    .slot.red { background: #ef4444; box-shadow: inset 0 0 8px rgba(0,0,0,0.4); }
    .slot.yellow { background: #facc15; box-shadow: inset 0 0 8px rgba(0,0,0,0.4); }
    .slot.win { box-shadow: 0 0 15px #fff; transform: scale(1.1); }
    .btn-row { width: 100%; max-width: 440px; display: flex; justify-content: space-between; margin-top: 14px; }
    .btn-opt { background: #1e293b; border: 1.5px solid #475569; color: #fff; font-weight: 800; padding: 8px 16px; border-radius: 10px; cursor: pointer; }
    .btn-opt.active { background: #3b82f6; border-color: #60a5fa; }
  </style>
</head>
<body>
  <div class="header">
    <h1>4 EN LÍNEA</h1>
    <div class="turn-badge" id="turnBadge">TURNO: 🔴 ROJO</div>
  </div>
  <div class="board" id="board"></div>
  <div class="btn-row">
    <button class="btn-opt" id="btnVsAI" onclick="toggleAI()">🤖 vs Computadora</button>
    <button class="btn-opt" onclick="initConnectFour()">🔄 Reiniciar</button>
  </div>

  <script>
    const ROWS = 6, COLS = 7;
    let grid = [];
    let turn = 'R'; // 'R' o 'Y'
    let gameOver = false;
    let vsAI = true;

    function toggleAI() {
      vsAI = !vsAI;
      document.getElementById('btnVsAI').textContent = vsAI ? '🤖 vs Computadora' : '👥 2 Jugadores';
    }

    function initConnectFour() {
      grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
      turn = 'R';
      gameOver = false;
      document.getElementById('turnBadge').textContent = 'TURNO: 🔴 ROJO';
      render();
    }

    function render() {
      const bEl = document.getElementById('board');
      bEl.innerHTML = '';

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const slot = document.createElement('div');
          slot.className = 'slot';
          const cell = grid[r][c];
          if (cell === 'R') slot.classList.add('red');
          if (cell === 'Y') slot.classList.add('yellow');

          slot.addEventListener('click', () => dropPiece(c));
          bEl.appendChild(slot);
        }
      }
    }

    function dropPiece(col) {
      if (gameOver) return;

      for (let r = ROWS - 1; r >= 0; r--) {
        if (!grid[r][col]) {
          grid[r][col] = turn;

          if (checkWin(r, col, turn)) {
            gameOver = true;
            document.getElementById('turnBadge').textContent = `🏆 ¡GANÓ EL ${turn === 'R' ? '🔴 ROJO' : '🟡 AMARILLO'}!`;
            render();
            return;
          }

          turn = turn === 'R' ? 'Y' : 'R';
          document.getElementById('turnBadge').textContent = `TURNO: ${turn === 'R' ? '🔴 ROJO' : '🟡 AMARILLO'}`;
          render();

          if (vsAI && turn === 'Y' && !gameOver) {
            setTimeout(aiMove, 350);
          }
          break;
        }
      }
    }

    function aiMove() {
      let availableCols = [];
      for (let c = 0; c < COLS; c++) {
        if (!grid[0][c]) availableCols.push(c);
      }

      if (availableCols.length > 0) {
        const chosen = availableCols[Math.floor(Math.random() * availableCols.length)];
        dropPiece(chosen);
      }
    }

    function checkWin(r, c, player) {
      function count(dr, dc) {
        let n = 0;
        let nr = r + dr, nc = c + dc;
        while (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === player) {
          n++;
          nr += dr;
          nc += dc;
        }
        return n;
      }

      const h = 1 + count(0, -1) + count(0, 1);
      const v = 1 + count(-1, 0) + count(1, 0);
      const d1 = 1 + count(-1, -1) + count(1, 1);
      const d2 = 1 + count(-1, 1) + count(1, -1);

      return h >= 4 || v >= 4 || d1 >= 4 || d2 >= 4;
    }

    initConnectFour();
  </script>
</body>
</html>
