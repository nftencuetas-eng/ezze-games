<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crossy Road 3D - ezze.games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/orientation.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; }
    body { background: #0f172a; color: #fff; font-family: 'Bungee', sans-serif; overflow: hidden; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #canvasContainer { position: relative; width: 100%; height: 100%; }
    canvas { width: 100%; height: 100%; display: block; background: #86efac; }
    .hud { position: absolute; top: 16px; left: 20px; right: 20px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
    .hud-box { background: rgba(15, 23, 42, 0.85); border: 2px solid #eab308; padding: 8px 18px; border-radius: 14px; font-size: 16px; color: #eab308; }
    .gameover-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 100; }
    .gameover-screen.hidden { display: none; }
    .btn-play { background: linear-gradient(135deg, #eab308, #ca8a04); color: #fff; font-family: 'Bungee', cursive; font-size: 20px; padding: 14px 34px; border: none; border-radius: 14px; cursor: pointer; box-shadow: 0 8px 0 #854d0e; }
  </style>
</head>
<body>
  <div id="canvasContainer">
    <div class="hud">
      <div class="hud-box">PUNTOS: <span id="scoreText">0</span></div>
      <div class="hud-box" style="border-color: #38bdf8; color: #38bdf8;">TOCA / FLECHAS PARA SALTAR 🐔</div>
    </div>
    <canvas id="crossyCanvas"></canvas>
    <div class="gameover-screen hidden" id="gameOver">
      <h1 style="font-size: 38px; color: #ef4444; text-shadow: 0 0 25px rgba(239, 68, 68, 0.8);">¡ATROPELLADO!</h1>
      <p style="font-family: 'Outfit', sans-serif; font-size: 18px; color: #94a3b8;">Distancia alcanzada: <strong id="finalScore" style="color: #eab308;">0</strong></p>
      <button class="btn-play" id="btnRestart">JUGAR DE NUEVO 🔄</button>
    </div>
  </div>

  <script src="../../js/orientation.js"></script>
  <script>
    new OrientationLock({ requiresLandscape: true, onOrientationChange: () => resize() });

    const canvas = document.getElementById('crossyCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    const GRID = 50;
    let chicken = { row: 0, col: 0, x: 0, y: 0 };
    let lanes = [];
    let score = 0;
    let gameOver = false;

    function initGame() {
      chicken = { row: 0, col: 0, x: 0, y: 0 };
      score = 0;
      gameOver = false;
      document.getElementById('scoreText').textContent = '0';
      document.getElementById('gameOver').classList.add('hidden');

      lanes = [];
      for (let r = -5; r < 40; r++) {
        generateLane(r);
      }
    }

    function generateLane(r) {
      if (r <= 0) {
        lanes.push({ row: r, type: 'grass', vehicles: [] });
      } else {
        const types = ['road', 'road', 'river', 'grass', 'train'];
        const type = types[Math.floor(Math.random() * types.length)];
        const speed = (Math.random() * 2.5 + 1.5) * (Math.random() > 0.5 ? 1 : -1);
        const vehicles = [];
        for (let i = 0; i < 3; i++) {
          vehicles.push({ x: i * 300 + Math.random() * 100, w: type === 'river' ? 120 : (type === 'train' ? 240 : 80) });
        }
        lanes.push({ row: r, type, speed, vehicles });
      }
    }

    function move(dRow, dCol) {
      if (gameOver) return;
      chicken.row += dRow;
      chicken.col += dCol;
      if (chicken.row > score) {
        score = chicken.row;
        document.getElementById('scoreText').textContent = score;
        generateLane(chicken.row + 30);
      }
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') move(1, 0);
      if (e.code === 'ArrowDown' || e.code === 'KeyS') move(-1, 0);
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') move(0, -1);
      if (e.code === 'ArrowRight' || e.code === 'KeyD') move(0, 1);
    });

    window.addEventListener('click', (e) => {
      if (!gameOver && e.target.tagName !== 'BUTTON') move(1, 0);
    });

    document.getElementById('btnRestart').addEventListener('click', initGame);

    function update() {
      if (gameOver) return;

      const playerX = width / 2 + chicken.col * GRID;
      const curLane = lanes.find(l => l.row === chicken.row);

      // Mover vehículos
      lanes.forEach(l => {
        if (l.vehicles) {
          l.vehicles.forEach(v => {
            v.x += l.speed;
            if (l.speed > 0 && v.x > width + 200) v.x = -300;
            if (l.speed < 0 && v.x < -300) v.x = width + 200;

            // Colisión en carretera o tren
            if (l.row === chicken.row && (l.type === 'road' || l.type === 'train')) {
              if (playerX + 16 > v.x && playerX - 16 < v.x + v.w) {
                triggerGameOver();
              }
            }
          });
        }
      });
    }

    function triggerGameOver() {
      gameOver = true;
      document.getElementById('finalScore').textContent = score;
      document.getElementById('gameOver').classList.remove('hidden');
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      const centerY = height * 0.65;

      // Dibujar líneas de carril
      lanes.forEach(l => {
        const laneY = centerY - (l.row - chicken.row) * GRID;
        if (laneY < -100 || laneY > height + 100) return;

        if (l.type === 'grass') {
          ctx.fillStyle = '#4ade80';
          ctx.fillRect(0, laneY - GRID / 2, width, GRID);
        } else if (l.type === 'road') {
          ctx.fillStyle = '#334155';
          ctx.fillRect(0, laneY - GRID / 2, width, GRID);
          ctx.strokeStyle = '#f8fafc';
          ctx.setLineDash([15, 15]);
          ctx.beginPath(); ctx.moveTo(0, laneY); ctx.lineTo(width, laneY); ctx.stroke();
          ctx.setLineDash([]);
        } else if (l.type === 'river') {
          ctx.fillStyle = '#38bdf8';
          ctx.fillRect(0, laneY - GRID / 2, width, GRID);
        } else if (l.type === 'train') {
          ctx.fillStyle = '#78350f';
          ctx.fillRect(0, laneY - GRID / 2, width, GRID);
        }

        // Dibujar vehículos
        if (l.vehicles) {
          l.vehicles.forEach(v => {
            if (l.type === 'road') ctx.fillStyle = '#ef4444';
            else if (l.type === 'train') ctx.fillStyle = '#f59e0b';
            else if (l.type === 'river') ctx.fillStyle = '#854d0e';
            ctx.fillRect(v.x, laneY - 16, v.w, 32);
            ctx.strokeStyle = '#000'; ctx.strokeRect(v.x, laneY - 16, v.w, 32);
          });
        }
      });

      // Dibujar Pollo
      const px = width / 2 + chicken.col * GRID;
      const py = centerY;

      ctx.fillStyle = '#fff';
      ctx.fillRect(px - 14, py - 14, 28, 28);
      ctx.fillStyle = '#f97316';
      ctx.fillRect(px - 4, py - 18, 8, 8); // Pico
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(px - 6, py - 22, 12, 6); // Cresta
      ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(px - 14, py - 14, 28, 28);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    initGame();
    loop();
  </script>
</body>
</html>
