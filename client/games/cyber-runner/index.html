<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cyber Runner 2099</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #05050f; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Courier New', monospace; color: #00ffff; overflow: hidden; }
    #canvas { border: 3px solid #00ffff; border-radius: 12px; background: #0b0c1b; box-shadow: 0 0 25px rgba(0, 255, 255, 0.4); }
    .hud { font-size: 20px; margin-bottom: 12px; display: flex; gap: 30px; }
  </style>
</head>
<body>
  <div class="hud">
    <span>PUNTOS: <strong id="score" style="color: #ff007f;">0</strong></span>
    <span>VELOCIDAD: <strong id="speed" style="color: #00ff66;">1.0x</strong></span>
  </div>
  <canvas id="canvas" width="800" height="400"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let player = { x: 80, y: 280, w: 40, h: 50, vy: 0, jump: false, grounded: true };
    let obstacles = [];
    let score = 0;
    let speed = 6;
    let gameOver = false;

    window.addEventListener('keydown', e => {
      if ((e.code === 'Space' || e.key === 'ArrowUp') && player.grounded) {
        player.vy = -13;
        player.grounded = false;
      }
      if (e.code === 'Space' && gameOver) {
        reset();
      }
    });

    function reset() {
      obstacles = [];
      score = 0;
      speed = 6;
      player.y = 280;
      player.vy = 0;
      gameOver = false;
    }

    function spawnObstacle() {
      if (Math.random() < 0.02 && (obstacles.length === 0 || obstacles[obstacles.length - 1].x < canvas.width - 250)) {
        obstacles.push({ x: canvas.width, y: 290, w: 30, h: 40, color: '#ff007f' });
      }
    }

    function update() {
      if (gameOver) return;

      score++;
      document.getElementById('score').textContent = score;
      if (score % 400 === 0) speed += 0.8;
      document.getElementById('speed').textContent = `${(speed / 6).toFixed(1)}x`;

      // Gravedad
      player.vy += 0.65;
      player.y += player.vy;

      if (player.y >= 280) {
        player.y = 280;
        player.vy = 0;
        player.grounded = true;
      }

      spawnObstacle();

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const ob = obstacles[i];
        ob.x -= speed;

        // Colisión
        if (
          player.x < ob.x + ob.w &&
          player.x + player.w > ob.x &&
          player.y < ob.y + ob.h &&
          player.y + player.h > ob.y
        ) {
          gameOver = true;
        }

        if (ob.x < -50) obstacles.splice(i, 1);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Suelo de neón
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, 330);
      ctx.lineTo(canvas.width, 330);
      ctx.stroke();

      // Cuadrícula cyberpunk
      ctx.strokeStyle = 'rgba(0, 255, 255, 0.15)';
      ctx.lineWidth = 1;
      for (let x = (Date.now() / 15) % 40; x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 330);
        ctx.lineTo(x - 50, canvas.height);
        ctx.stroke();
      }

      // Jugador
      ctx.fillStyle = '#00ffcc';
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#00ffcc';
      ctx.fillRect(player.x, player.y, player.w, player.h);

      ctx.fillStyle = '#ff007f';
      ctx.fillRect(player.x + 10, player.y + 12, 20, 8); // Visor

      // Obstáculos
      ctx.shadowColor = '#ff007f';
      obstacles.forEach(ob => {
        ctx.fillStyle = ob.color;
        ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
      });
      ctx.shadowBlur = 0;

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff007f';
        ctx.font = '32px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('¡SISTEMA CRASHEADO!', canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = '#00ffff';
        ctx.font = '18px Courier New';
        ctx.fillText('Presiona ESPACIO para reiniciar', canvas.width / 2, canvas.height / 2 + 25);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
