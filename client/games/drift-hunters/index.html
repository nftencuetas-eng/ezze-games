<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Drift Hunters 3D - ezze.games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/orientation.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; }
    body { background: #090d16; color: #fff; font-family: 'Bungee', sans-serif; overflow: hidden; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #canvasContainer { position: relative; width: 100%; height: 100%; }
    canvas { width: 100%; height: 100%; display: block; background: #1e293b; }
    .hud { position: absolute; top: 16px; left: 20px; right: 20px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
    .hud-box { background: rgba(15, 23, 42, 0.85); border: 2px solid #ef4444; padding: 8px 18px; border-radius: 14px; font-size: 16px; color: #ef4444; text-shadow: 0 0 10px rgba(239, 68, 68, 0.6); }
    .drift-mult { font-size: 26px; color: #f59e0b; text-shadow: 0 0 15px rgba(245, 158, 11, 0.8); }
    /* Touch controls */
    .touch-bar { position: absolute; bottom: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; pointer-events: none; z-index: 20; }
    .touch-grp { display: flex; gap: 14px; pointer-events: auto; }
    .t-btn { width: 64px; height: 64px; border-radius: 50%; background: rgba(15, 23, 42, 0.8); border: 3px solid #fff; color: #fff; font-size: 24px; font-family: 'Bungee'; display: flex; align-items: center; justify-content: center; }
    .t-btn:active { background: #ef4444; transform: scale(0.92); }
  </style>
</head>
<body>
  <div id="canvasContainer">
    <div class="hud">
      <div class="hud-box">PUNTOS DRIFT: <span id="driftScore">0</span></div>
      <div class="drift-mult" id="multText">x1.0</div>
      <div class="hud-box" style="border-color: #38bdf8; color: #38bdf8;">VEL: <span id="speedText">0</span> KM/H</div>
    </div>
    <canvas id="driftCanvas"></canvas>
    <div class="touch-bar">
      <div class="touch-grp">
        <button class="t-btn" id="btnSteerL">◀</button>
        <button class="t-btn" id="btnSteerR">▶</button>
      </div>
      <div class="touch-grp">
        <button class="t-btn" style="background: rgba(239, 68, 68, 0.8);" id="btnHandbrake">HAND</button>
        <button class="t-btn" style="background: rgba(16, 185, 129, 0.8); width: 72px; height: 72px;" id="btnThrottle">GAS</button>
      </div>
    </div>
  </div>

  <script src="../../js/orientation.js"></script>
  <script>
    new OrientationLock({ requiresLandscape: true, onOrientationChange: () => resize() });

    const canvas = document.getElementById('driftCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    let car = {
      x: 0, y: 0,
      vx: 0, vy: 0,
      angle: 0,
      speed: 0,
      steer: 0,
      driftScore: 0,
      multiplier: 1.0
    };

    let skidmarks = [];
    let smoke = [];
    let keys = {};
    let touch = { gas: false, brake: false, left: false, right: false };

    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    const bindT = (id, k) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); touch[k] = true; });
      el.addEventListener('touchend', (e) => { e.preventDefault(); touch[k] = false; });
      el.addEventListener('mousedown', () => touch[k] = true);
      el.addEventListener('mouseup', () => touch[k] = false);
    };
    bindT('btnThrottle', 'gas');
    bindT('btnHandbrake', 'brake');
    bindT('btnSteerL', 'left');
    bindT('btnSteerR', 'right');

    function update() {
      const isGas = keys['ArrowUp'] || keys['KeyW'] || touch.gas;
      const isBrake = keys['ArrowDown'] || keys['KeyS'] || touch.brake;
      const isLeft = keys['ArrowLeft'] || keys['KeyA'] || touch.left;
      const isRight = keys['ArrowRight'] || keys['KeyD'] || touch.right;

      // Aceleración y frenado
      if (isGas) car.speed = Math.min(14, car.speed + 0.22);
      else if (isBrake) car.speed = Math.max(-4, car.speed - 0.35);
      else car.speed *= 0.985;

      // Giro
      const steerSpeed = 0.055;
      if (isLeft) car.angle -= steerSpeed * (car.speed / 10);
      if (isRight) car.angle += steerSpeed * (car.speed / 10);

      // Físicas de derrape (Drift vector)
      const forwardX = Math.cos(car.angle) * car.speed;
      const forwardY = Math.sin(car.angle) * car.speed;

      car.vx = car.vx * 0.92 + forwardX * 0.08;
      car.vy = car.vy * 0.92 + forwardY * 0.08;

      car.x += car.vx;
      car.y += car.vy;

      // Cálculo del ángulo de derrape
      const moveAngle = Math.atan2(car.vy, car.vx);
      let angleDiff = Math.abs(car.angle - moveAngle);
      while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
      angleDiff = Math.abs(angleDiff);

      const isDrifting = angleDiff > 0.4 && Math.hypot(car.vx, car.vy) > 3;

      if (isDrifting) {
        car.multiplier = Math.min(5.0, car.multiplier + 0.015);
        car.driftScore += Math.floor(angleDiff * 10 * car.multiplier);
        document.getElementById('driftScore').textContent = car.driftScore;
        document.getElementById('multText').textContent = `x${car.multiplier.toFixed(1)}`;

        // Huellas de derrape
        skidmarks.push({ x: car.x, y: car.y, angle: car.angle, life: 120 });

        // Humo
        for (let i = 0; i < 2; i++) {
          smoke.push({
            x: car.x - Math.cos(car.angle) * 20 + (Math.random() - 0.5) * 10,
            y: car.y - Math.sin(car.angle) * 20 + (Math.random() - 0.5) * 10,
            r: Math.random() * 8 + 4,
            life: 30
          });
        }
      } else {
        car.multiplier = Math.max(1.0, car.multiplier - 0.02);
        document.getElementById('multText').textContent = `x${car.multiplier.toFixed(1)}`;
      }

      document.getElementById('speedText').textContent = Math.floor(Math.hypot(car.vx, car.vy) * 15);

      // Actualizar humo y huellas
      for (let i = smoke.length - 1; i >= 0; i--) {
        smoke[i].r += 0.5;
        smoke[i].life--;
        if (smoke[i].life <= 0) smoke.splice(i, 1);
      }

      if (skidmarks.length > 300) skidmarks.shift();
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      ctx.save();
      ctx.translate(width / 2 - car.x, height / 2 - car.y);

      // Pista de asfalto con cuadrícula
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 2;
      const startX = Math.floor((car.x - width) / 100) * 100;
      const startY = Math.floor((car.y - height) / 100) * 100;
      for (let x = startX; x < startX + width * 2; x += 100) {
        ctx.beginPath(); ctx.moveTo(x, startY); ctx.lineTo(x, startY + height * 2); ctx.stroke();
      }
      for (let y = startY; y < startY + height * 2; y += 100) {
        ctx.beginPath(); ctx.moveTo(startX, y); ctx.lineTo(startX + width * 2, y); ctx.stroke();
      }

      // Huellas de derrape
      ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
      skidmarks.forEach(s => {
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.angle);
        ctx.fillRect(-12, -10, 6, 20);
        ctx.fillRect(6, -10, 6, 20);
        ctx.restore();
      });

      // Humo de neumáticos
      smoke.forEach(sm => {
        ctx.fillStyle = `rgba(226, 232, 240, ${sm.life / 60})`;
        ctx.beginPath();
        ctx.arc(sm.x, sm.y, sm.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Dibujar Auto
      ctx.save();
      ctx.translate(car.x, car.y);
      ctx.rotate(car.angle);

      // Chasis del auto deportivo
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(-24, -14, 48, 28);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(-24, -14, 48, 28);

      // Techo / Parabrisas
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-8, -10, 20, 20);

      // Luces delanteras
      ctx.fillStyle = '#fef08a';
      ctx.fillRect(20, -12, 4, 6);
      ctx.fillRect(20, 6, 4, 6);

      // Alerón trasero
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(-26, -14, 4, 28);

      ctx.restore();
      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
