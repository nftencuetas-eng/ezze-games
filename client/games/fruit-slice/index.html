<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fruit Slice Master - ezze.games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; font-family: 'Bungee', cursive; }
    body { background: #1c1917; color: #fff; width: 100vw; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    #canvasWrap { position: relative; width: 100%; height: 100%; max-width: 500px; max-height: 800px; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
    canvas { width: 100%; height: 100%; display: block; background: linear-gradient(180deg, #292524 0%, #1c1917 100%); cursor: crosshair; }
    .hud { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; font-size: 16px; color: #facc15; z-index: 10; pointer-events: none; }
    .overlay { position: absolute; inset: 0; background: rgba(28, 25, 23, 0.9); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 20px; z-index: 20; }
    .overlay.hidden { display: none; }
    .btn-play { background: #ef4444; color: #fff; font-family: 'Bungee'; font-size: 20px; padding: 14px 36px; border: none; border-radius: 14px; cursor: pointer; box-shadow: 0 6px 0 #b91c1c; }
  </style>
</head>
<body>
  <div id="canvasWrap">
    <div class="hud">
      <div>🍉 PUNTOS: <span id="scoreText">0</span></div>
      <div>VIDAS: <span id="livesText">❤️❤️❤️</span></div>
    </div>
    <canvas id="fruitCanvas" width="400" height="600"></canvas>
    <div class="overlay" id="startScreen">
      <h1 style="font-size: 38px; color: #ef4444; text-shadow: 0 0 20px rgba(239, 68, 68, 0.6);">FRUIT SLICE</h1>
      <p style="font-family: 'Outfit'; font-size: 16px; color: #d6d3d1;">¡Corta las frutas en el aire y esquiva las bombas ninja!</p>
      <button class="btn-play" onclick="startGame()">¡A CORTAR!</button>
    </div>
    <div class="overlay hidden" id="gameOverScreen">
      <h1 style="font-size: 34px; color: #ef4444;">¡FIN DEL JUEGO!</h1>
      <p style="font-family: 'Outfit'; font-size: 18px; color: #e7e5e4;">Puntos conseguidos: <strong id="finalScore" style="color: #facc15;">0</strong></p>
      <button class="btn-play" onclick="startGame()">JUGAR DE NUEVO</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('fruitCanvas');
    const ctx = canvas.getContext('2d');

    const FRUIT_TYPES = [
      { emoji: '🍉', color: '#ef4444', points: 10 },
      { emoji: '🍌', color: '#facc15', points: 15 },
      { emoji: '🍓', color: '#f43f5e', points: 20 },
      { emoji: '🍍', color: '#eab308', points: 25 },
      { emoji: '💣', color: '#000000', isBomb: true }
    ];

    let fruits = [];
    let particles = [];
    let trail = [];
    let score = 0;
    let lives = 3;
    let isPlaying = false;
    let tick = 0;

    let audioCtx = null;
    function playSlash() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.08);
      } catch(e){}
    }

    function startGame() {
      fruits = [];
      particles = [];
      trail = [];
      score = 0;
      lives = 3;
      isPlaying = true;
      document.getElementById('scoreText').textContent = '0';
      document.getElementById('livesText').textContent = '❤️❤️❤️';
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
    }

    function spawnFruit() {
      const type = FRUIT_TYPES[Math.floor(Math.random() * FRUIT_TYPES.length)];
      const x = Math.random() * (canvas.width - 100) + 50;
      const vx = (Math.random() - 0.5) * 4;
      const vy = -(Math.random() * 4 + 11);
      fruits.push({ x, y: canvas.height, vx, vy, type, sliced: false, r: 28 });
    }

    function update() {
      if (!isPlaying) return;

      tick++;
      if (tick % 60 === 0) spawnFruit();

      // Mover frutas
      for (let i = fruits.length - 1; i >= 0; i--) {
        const f = fruits[i];
        f.vy += 0.28; // Gravedad
        f.x += f.vx;
        f.y += f.vy;

        if (f.y > canvas.height + 50) {
          if (!f.sliced && !f.type.isBomb) {
            lives--;
            document.getElementById('livesText').textContent = '❤️'.repeat(Math.max(0, lives));
            if (lives <= 0) triggerGameOver();
          }
          fruits.splice(i, 1);
        }
      }

      // Partículas de jugo
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.03;
        if (p.alpha <= 0) particles.splice(i, 1);
      }

      // Estela de corte
      if (trail.length > 8) trail.shift();
    }

    function triggerGameOver() {
      isPlaying = false;
      document.getElementById('finalScore').textContent = score;
      document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Frutas
      fruits.forEach(f => {
        if (!f.sliced) {
          ctx.font = '40px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(f.type.emoji, f.x, f.y);
        }
      });

      // Partículas
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1.0;
      });

      // Estela de corte ninja
      if (trail.length > 1) {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(trail[0].x, trail[0].y);
        for (let i = 1; i < trail.length; i++) ctx.lineTo(trail[i].x, trail[i].y);
        ctx.stroke();
      }
    }

    function checkSlice(x, y) {
      trail.push({ x, y });

      fruits.forEach(f => {
        if (!f.sliced && Math.hypot(f.x - x, f.y - y) < f.r + 10) {
          f.sliced = true;
          playSlash();

          if (f.type.isBomb) {
            triggerGameOver();
            return;
          }

          score += f.type.points;
          document.getElementById('scoreText').textContent = score;

          // Crear explosión de jugo
          for (let i = 0; i < 15; i++) {
            particles.push({
              x: f.x, y: f.y,
              vx: (Math.random() - 0.5) * 8,
              vy: (Math.random() - 0.5) * 8,
              r: Math.random() * 4 + 2,
              color: f.type.color,
              alpha: 1.0
            });
          }
        }
      });
    }

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    }

    canvas.addEventListener('mousemove', e => { if (e.buttons === 1) { const { x, y } = getCoords(e); checkSlice(x, y); } });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (e.touches.length > 0) {
        const { x, y } = getCoords(e.touches[0]);
        checkSlice(x, y);
      }
    }, { passive: false });

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
