<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Helix Jump 3D - ezze.games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/orientation.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; }
    body { background: #0f172a; color: #fff; font-family: 'Bungee', sans-serif; overflow: hidden; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #canvasContainer { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; background: #090d16; }
    .hud { position: absolute; top: 16px; left: 20px; right: 20px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
    .hud-box { background: rgba(15, 23, 42, 0.85); border: 2px solid #f43f5e; padding: 8px 18px; border-radius: 14px; font-size: 16px; color: #f43f5e; }
  </style>
</head>
<body>
  <div id="canvasContainer">
    <div class="hud">
      <div class="hud-box">PUNTOS: <span id="scoreText">0</span></div>
      <div class="hud-box" style="border-color: #38bdf8; color: #38bdf8;">GIRA LA TORRE PARA CAER 🌀</div>
    </div>
    <canvas id="helixCanvas" width="460" height="520"></canvas>
  </div>

  <script src="../../js/orientation.js"></script>
  <script>
    new OrientationLock({ requiresLandscape: true });

    const canvas = document.getElementById('helixCanvas');
    const ctx = canvas.getContext('2d');

    let ball = { y: 150, vy: 0, r: 12 };
    let towerRot = 0;
    let score = 0;
    let levels = [];
    const TOTAL_LEVELS = 30;

    function initGame() {
      ball = { y: 150, vy: 0, r: 12 };
      towerRot = 0;
      score = 0;
      levels = [];
      document.getElementById('scoreText').textContent = '0';

      for (let i = 0; i < TOTAL_LEVELS; i++) {
        const holeAngle = Math.random() * Math.PI * 2;
        const dangerAngle = (holeAngle + Math.PI) % (Math.PI * 2);
        levels.push({ y: 180 + i * 110, holeAngle, dangerAngle });
      }
    }

    let isDrag = false;
    let lastX = 0;

    const startDrag = (cx) => { isDrag = true; lastX = cx; };
    const moveDrag = (cx) => {
      if (!isDrag) return;
      const dx = cx - lastX;
      towerRot += dx * 0.015;
      lastX = cx;
    };
    const endDrag = () => { isDrag = false; };

    window.addEventListener('mousedown', e => startDrag(e.clientX));
    window.addEventListener('mousemove', e => moveDrag(e.clientX));
    window.addEventListener('mouseup', endDrag);

    window.addEventListener('touchstart', e => { if (e.touches.length > 0) startDrag(e.touches[0].clientX); });
    window.addEventListener('touchmove', e => { if (e.touches.length > 0) moveDrag(e.touches[0].clientX); });
    window.addEventListener('touchend', endDrag);

    function update() {
      ball.vy += 0.4;
      ball.y += ball.vy;

      // Colisiones con plataformas
      levels.forEach(lvl => {
        if (ball.y + ball.r >= lvl.y && ball.y - ball.r <= lvl.y + 10 && ball.vy > 0) {
          // Comprobar si coincide con el hueco
          let relAngle = (Math.PI / 2 - towerRot) % (Math.PI * 2);
          if (relAngle < 0) relAngle += Math.PI * 2;

          let diffHole = Math.abs(relAngle - lvl.holeAngle);
          while (diffHole > Math.PI) diffHole = Math.abs(diffHole - Math.PI * 2);

          let diffDanger = Math.abs(relAngle - lvl.dangerAngle);
          while (diffDanger > Math.PI) diffDanger = Math.abs(diffDanger - Math.PI * 2);

          if (diffHole < 0.5) {
            // Cae por el hueco
            score += 10;
            document.getElementById('scoreText').textContent = score;
          } else if (diffDanger < 0.5) {
            // Toca bloque rojo peligroso
            alert('¡Tocaste la zona roja! Puntos: ' + score);
            initGame();
          } else {
            // Rebota
            ball.y = lvl.y - ball.r;
            ball.vy = -10;
          }
        }
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = 250;

      // Columna central de la torre
      ctx.fillStyle = '#334155';
      ctx.fillRect(cx - 30, 0, 60, canvas.height);

      // Dibujar niveles de la torre
      levels.forEach(lvl => {
        const renderY = lvl.y - (ball.y - 150);
        if (renderY < -50 || renderY > canvas.height + 50) return;

        // Plataforma circular en perspectiva
        ctx.strokeStyle = '#f43f5e';
        ctx.lineWidth = 14;
        ctx.beginPath();
        ctx.ellipse(cx, renderY, 140, 30, 0, towerRot + lvl.holeAngle + 0.5, towerRot + lvl.holeAngle + Math.PI * 2 - 0.5);
        ctx.stroke();

        // Zona de peligro roja
        ctx.strokeStyle = '#ef4444';
        ctx.beginPath();
        ctx.ellipse(cx, renderY, 140, 30, 0, towerRot + lvl.dangerAngle - 0.3, towerRot + lvl.dangerAngle + 0.3);
        ctx.stroke();
      });

      // Pelota que rebota
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(cx, 150, ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    initGame();
    loop();
  </script>
</body>
</html>
