<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HexGL 3D Futuristic Racing - ezze.games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; font-family: 'Bungee', cursive; }
    body { background: #020617; color: #fff; width: 100vw; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    #canvasWrap { position: relative; width: 100%; height: 100%; }
    canvas { width: 100%; height: 100%; display: block; }
    .hud { position: absolute; top: 16px; left: 20px; right: 20px; display: flex; justify-content: space-between; font-size: 16px; color: #06b6d4; z-index: 10; pointer-events: none; }
    .hud-pill { background: rgba(15, 23, 42, 0.85); border: 2px solid #06b6d4; padding: 6px 14px; border-radius: 12px; }
    .overlay { position: absolute; inset: 0; background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px; z-index: 30; }
    .overlay.hidden { display: none; }
    .btn-play { background: #06b6d4; color: #000; font-family: 'Bungee'; font-size: 20px; padding: 14px 36px; border: none; border-radius: 14px; cursor: pointer; box-shadow: 0 6px 0 #0891b2; }
    /* Touch Steering */
    .touch-bar { position: absolute; bottom: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 20; pointer-events: none; }
    .t-btn { width: 70px; height: 70px; border-radius: 50%; background: rgba(30, 41, 59, 0.8); border: 2px solid #06b6d4; color: #fff; font-size: 26px; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
    .t-btn:active { background: #06b6d4; color: #000; }
  </style>
</head>
<body>
  <div id="canvasWrap">
    <div class="hud">
      <div class="hud-pill">VEL: <span id="speedText" style="color:#facc15;">0</span> KM/H</div>
      <div class="hud-pill">DISTANCIA: <span id="distText">0</span>m</div>
    </div>
    <canvas id="raceCanvas"></canvas>
    <div class="touch-bar">
      <button class="t-btn" id="btnSteerL">◀</button>
      <button class="t-btn" style="background: rgba(16, 185, 129, 0.8); border-color: #10b981; width: 80px; height: 80px;" id="btnBoost">⚡</button>
      <button class="t-btn" id="btnSteerR">▶</button>
    </div>
    <div class="overlay" id="startScreen">
      <h1 style="font-size: 42px; color: #06b6d4; text-shadow: 0 0 25px rgba(6, 182, 212, 0.8);">HEXGL 3D RACER</h1>
      <p style="font-family: 'Outfit'; font-size: 16px; color: #94a3b8;">Pilota la nave hiperbólica a través de la pista sci-fi y esquiva los pilares de energía</p>
      <button class="btn-play" id="btnStart">DESPEGAR</button>
    </div>
    <div class="overlay hidden" id="gameOverScreen">
      <h1 style="font-size: 38px; color: #ef4444;">¡COLISIÓN DE NAVE!</h1>
      <p style="font-family: 'Outfit'; font-size: 18px; color: #cbd5e1;">Distancia alcanzada: <strong id="finalDist" style="color: #06b6d4;">0</strong> m</p>
      <button class="btn-play" id="btnRestart">CORRER DE NUEVO</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    let scene, camera, renderer;
    let ship, track;
    let obstacles = [];
    let isPlaying = false;
    let speed = 60;
    let distance = 0;
    let shipX = 0, targetShipX = 0;
    let isBoosting = false;

    function initRace() {
      const canvas = document.getElementById('raceCanvas');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020617);
      scene.fog = new THREE.Fog(0x020617, 30, 180);

      camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 250);
      camera.position.set(0, 3, 6);
      camera.lookAt(0, 1, -20);

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);

      const amb = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(amb);

      const pLight = new THREE.PointLight(0x06b6d4, 2, 40);
      pLight.position.set(0, 6, -5);
      scene.add(pLight);

      // Pista Sci-Fi
      const trackGeo = new THREE.PlaneGeometry(16, 400);
      const trackMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.3 });
      track = new THREE.Mesh(trackGeo, trackMat);
      track.rotation.x = -Math.PI / 2;
      track.position.z = -150;
      scene.add(track);

      // Líneas Neón de la pista
      [-7, 7].forEach(lx => {
        const lineGeo = new THREE.BoxGeometry(0.2, 0.1, 400);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4 });
        const line = new THREE.Mesh(lineGeo, lineMat);
        line.position.set(lx, 0.05, -150);
        scene.add(line);
      });

      // Nave Sci-Fi
      const shipGroup = new THREE.Group();
      const bodyGeo = new THREE.ConeGeometry(1.2, 3.2, 4);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x06b6d4, metalness: 0.8, roughness: 0.2 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.rotation.x = Math.PI / 2;
      body.rotation.y = Math.PI / 4;
      shipGroup.add(body);

      // Alas
      const wingGeo = new THREE.BoxGeometry(3.6, 0.1, 1.2);
      const wingMat = new THREE.MeshStandardMaterial({ color: 0x0284c7 });
      const wings = new THREE.Mesh(wingGeo, wingMat);
      wings.position.set(0, 0, 0.4);
      shipGroup.add(wings);

      // Propulsores Neón
      const thrustGeo = new THREE.SphereGeometry(0.3, 8, 8);
      const thrustMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
      const t1 = new THREE.Mesh(thrustGeo, thrustMat);
      t1.position.set(-0.8, 0, 1.5);
      const t2 = new THREE.Mesh(thrustGeo, thrustMat);
      t2.position.set(0.8, 0, 1.5);
      shipGroup.add(t1); shipGroup.add(t2);

      ship = shipGroup;
      ship.position.set(0, 0.8, 0);
      scene.add(ship);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function spawnObstacles() {
      obstacles.forEach(o => scene.remove(o));
      obstacles = [];

      for (let z = -40; z > -350; z -= 30) {
        const ox = (Math.random() - 0.5) * 11;
        const geo = new THREE.CylinderGeometry(0.6, 0.6, 6, 12);
        const mat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0x991b1b });
        const obs = new THREE.Mesh(geo, mat);
        obs.position.set(ox, 3, z);
        scene.add(obs);
        obstacles.push(obs);
      }
    }

    function startRace() {
      shipX = 0;
      targetShipX = 0;
      speed = 60;
      distance = 0;
      isPlaying = true;
      spawnObstacles();
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
    }

    let keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space') isBoosting = true;
    });
    window.addEventListener('keyup', e => {
      keys[e.code] = false;
      if (e.code === 'Space') isBoosting = false;
    });

    const bindT = (id, fnStart, fnEnd) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); fnStart(); });
      el.addEventListener('touchend', (e) => { e.preventDefault(); if (fnEnd) fnEnd(); });
      el.addEventListener('mousedown', fnStart);
      el.addEventListener('mouseup', fnEnd || (() => {}));
    };
    bindT('btnSteerL', () => keys['ArrowLeft'] = true, () => keys['ArrowLeft'] = false);
    bindT('btnSteerR', () => keys['ArrowRight'] = true, () => keys['ArrowRight'] = false);
    bindT('btnBoost', () => isBoosting = true, () => isBoosting = false);

    function update() {
      if (!isPlaying || !ship) return;

      const dt = 1 / 60;
      const targetSpeed = isBoosting ? 130 : 75;
      speed += (targetSpeed - speed) * 0.05;

      distance += speed * dt * 0.3;
      document.getElementById('speedText').textContent = Math.floor(speed * 3.6);
      document.getElementById('distText').textContent = Math.floor(distance);

      if (keys['ArrowLeft'] || keys['KeyA']) targetShipX = Math.max(-6, targetShipX - 12 * dt);
      if (keys['ArrowRight'] || keys['KeyD']) targetShipX = Math.min(6, targetShipX + 12 * dt);

      shipX += (targetShipX - shipX) * 0.15;
      ship.position.x = shipX;
      ship.rotation.z = (shipX - targetShipX) * 0.2;

      // Mover obstáculos
      obstacles.forEach(o => {
        o.position.z += speed * dt;

        // Colisión
        if (Math.abs(o.position.z - ship.position.z) < 1.8 && Math.abs(o.position.x - ship.position.x) < 1.4) {
          isPlaying = false;
          document.getElementById('finalDist').textContent = Math.floor(distance);
          document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        if (o.position.z > 10) {
          o.position.z = -320;
          o.position.x = (Math.random() - 0.5) * 11;
        }
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      update();
      renderer.render(scene, camera);
    }

    document.getElementById('btnStart').addEventListener('click', () => {
      initRace();
      startRace();
      animate();
    });

    document.getElementById('btnRestart').addEventListener('click', startRace);
  </script>
</body>
</html>
