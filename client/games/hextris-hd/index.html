<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hextris HD - ezze.games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; font-family: 'Bungee', cursive; }
    body { background: #0f172a; color: #fff; width: 100vw; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #canvasWrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; }
    .hud { position: absolute; top: 16px; left: 20px; right: 20px; display: flex; justify-content: space-between; font-size: 16px; color: #06b6d4; z-index: 10; pointer-events: none; }
    .touch-controls { position: absolute; bottom: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 20; pointer-events: none; }
    .btn-rot { width: 75px; height: 75px; border-radius: 50%; background: rgba(15, 23, 42, 0.85); border: 3px solid #06b6d4; color: #fff; font-size: 28px; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
    .btn-rot:active { background: #06b6d4; }
    .overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px; z-index: 30; }
    .overlay.hidden { display: none; }
    .btn-play { background: #06b6d4; color: #000; font-family: 'Bungee'; font-size: 20px; padding: 14px 36px; border: none; border-radius: 14px; cursor: pointer; box-shadow: 0 6px 0 #0891b2; }
  </style>
</head>
<body>
  <div id="canvasWrap">
    <div class="hud">
      <div>PUNTOS: <span id="scoreText" style="color:#facc15;">0</span></div>
      <div>RÉCORD: <span id="bestText">0</span></div>
    </div>
    <canvas id="hexCanvas" width="480" height="480"></canvas>
    <div class="touch-controls">
      <button class="btn-rot" id="btnRotL">↺</button>
      <button class="btn-rot" id="btnRotR">↻</button>
    </div>
    <div class="overlay" id="startScreen">
      <h1 style="font-size: 42px; color: #06b6d4;">HEXTRIS HD</h1>
      <p style="font-family: 'Outfit'; font-size: 16px; color: #94a3b8;">Gira el hexágono central para agrupar 3 bloques del mismo color</p>
      <button class="btn-play" id="btnStart">JUGAR</button>
    </div>
    <div class="overlay hidden" id="gameOverScreen">
      <h1 style="font-size: 38px; color: #ef4444;">¡HEXÁGONO LLENO!</h1>
      <p style="font-family: 'Outfit'; font-size: 18px; color: #cbd5e1;">Puntos: <strong id="finalScore" style="color: #06b6d4;">0</strong></p>
      <button class="btn-play" id="btnRestart">REINTENTAR</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('hexCanvas');
    const ctx = canvas.getContext('2d');

    const COLORS = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b'];
    let rotation = 0;
    let stacks = [[], [], [], [], [], []];
    let fallingBlocks = [];
    let score = 0;
    let best = parseInt(localStorage.getItem('hextris_best') || '0');
    document.getElementById('bestText').textContent = best;
    let isPlaying = false;
    let spawnTimer = 0;

    function startGame() {
      rotation = 0;
      stacks = [[], [], [], [], [], []];
      fallingBlocks = [];
      score = 0;
      isPlaying = true;
      document.getElementById('scoreText').textContent = '0';
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
    }

    function rotateHex(dir) {
      if (!isPlaying) return;
      rotation = (rotation + dir + 6) % 6;
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') rotateHex(-1);
      if (e.code === 'ArrowRight' || e.code === 'KeyD') rotateHex(1);
    });

    document.getElementById('btnRotL').addEventListener('click', () => rotateHex(-1));
    document.getElementById('btnRotR').addEventListener('click', () => rotateHex(1));

    function spawnBlock() {
      const side = Math.floor(Math.random() * 6);
      const color = COLORS[Math.floor(Math.random() * COLORS.length)];
      fallingBlocks.push({ side, color, dist: 220 });
    }

    function update() {
      if (!isPlaying) return;

      spawnTimer++;
      if (spawnTimer % 55 === 0) spawnBlock();

      for (let i = fallingBlocks.length - 1; i >= 0; i--) {
        const b = fallingBlocks[i];
        b.dist -= 2.2;

        const effSide = (b.side - rotation + 6) % 6;
        const curStack = stacks[effSide];
        const stackHeight = curStack.length * 16 + 50;

        if (b.dist <= stackHeight) {
          curStack.push(b.color);
          fallingBlocks.splice(i, 1);
          checkCombos(effSide);

          if (curStack.length >= 8) {
            isPlaying = false;
            if (score > best) {
              best = score;
              localStorage.setItem('hextris_best', best);
            }
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverScreen').classList.remove('hidden');
          }
        }
      }
    }

    function checkCombos(side) {
      const stack = stacks[side];
      if (stack.length >= 3) {
        const last = stack[stack.length - 1];
        let matchCount = 1;
        for (let i = stack.length - 2; i >= 0; i--) {
          if (stack[i] === last) matchCount++;
          else break;
        }

        if (matchCount >= 3) {
          stack.splice(stack.length - matchCount, matchCount);
          score += matchCount * 100;
          document.getElementById('scoreText').textContent = score;
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate((rotation * Math.PI) / 3);

      // Hexágono central
      ctx.fillStyle = '#06b6d4';
      drawHex(0, 0, 45);
      ctx.fill();

      // Bloques apilados
      for (let s = 0; s < 6; s++) {
        const angle = (s * Math.PI) / 3;
        ctx.save();
        ctx.rotate(angle);

        stacks[s].forEach((col, idx) => {
          ctx.fillStyle = col;
          ctx.fillRect(-22, 45 + idx * 16, 44, 13);
          ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
          ctx.strokeRect(-22, 45 + idx * 16, 44, 13);
        });

        ctx.restore();
      }

      // Bloques cayendo
      fallingBlocks.forEach(b => {
        const angle = (b.side * Math.PI) / 3;
        ctx.save();
        ctx.rotate(angle);
        ctx.fillStyle = b.color;
        ctx.fillRect(-22, b.dist, 44, 14);
        ctx.restore();
      });

      ctx.restore();
    }

    function drawHex(x, y, r) {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i * Math.PI) / 3;
        const px = x + Math.cos(a) * r;
        const py = y + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    document.getElementById('btnStart').addEventListener('click', startGame);
    document.getElementById('btnRestart').addEventListener('click', startGame);

    loop();
  </script>
</body>
</html>
