<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kids Jigsaw Puzzle World - ezze.games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Outfit', sans-serif; }
    body { background: linear-gradient(180deg, #1e3a8a 0%, #2563eb 60%, #3b82f6 100%); color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; }
    .game-box { width: 100%; max-width: 480px; background: rgba(30, 58, 138, 0.85); border: 3px solid #60a5fa; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); backdrop-filter: blur(10px); }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .stat-badge { background: #1e40af; border: 1.5px solid #93c5fd; padding: 6px 14px; border-radius: 12px; font-weight: 800; font-size: 14px; color: #fef08a; }
    .puzzle-board { width: 100%; aspect-ratio: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 6px; background: #0f172a; border-radius: 16px; padding: 8px; border: 2px solid #3b82f6; }
    .tile { background: #1d4ed8; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 48px; cursor: pointer; transition: transform 0.15s ease, background 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .tile:hover { transform: scale(1.05); }
    .tile.empty { background: rgba(255, 255, 255, 0.05); border: 2px dashed #475569; cursor: default; }
    .overlay { position: fixed; inset: 0; background: rgba(30, 58, 138, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 20px; z-index: 50; }
    .overlay.hidden { display: none; }
    .btn-play { background: #facc15; color: #000; font-family: 'Bungee'; font-size: 22px; padding: 14px 40px; border: none; border-radius: 16px; cursor: pointer; box-shadow: 0 6px 0 #ca8a04; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <div class="stat-badge">🦖 PUZZLE: <span id="themeText">Dinosaurios</span></div>
      <div class="stat-badge">🔄 MOVIMIENTOS: <span id="movesText">0</span></div>
    </div>
    <div class="puzzle-board" id="board"></div>
  </div>

  <div class="overlay" id="startScreen">
    <h1 style="font-family: 'Bungee'; font-size: 36px; color: #facc15; text-shadow: 0 0 20px rgba(250, 204, 21, 0.6);">KIDS JIGSAW</h1>
    <p style="font-size: 16px; color: #dbeafe; max-width: 320px;">¡Desliza las piezas ilustradas para completar el rompecabezas!</p>
    <button class="btn-play" onclick="startGame()">¡A JUGAR!</button>
  </div>

  <div class="overlay hidden" id="gameOverScreen">
    <h1 style="font-family: 'Bungee'; font-size: 34px; color: #facc15;">🎉 ¡ROMPECABEZAS ARMADO! 🎉</h1>
    <p style="font-size: 18px; color: #dbeafe;">¡Completado con éxito!</p>
    <button class="btn-play" onclick="startGame()">JUGAR OTRA VEZ</button>
  </div>

  <script>
    const EMOJIS = ['🦖', '🦕', '🌴', '🌋', '⭐', '🥚', '🌿', '🐊', ''];
    let tiles = [];
    let moves = 0;

    let audioCtx = null;
    function playSnap() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(500, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
      } catch(e){}
    }

    function startGame() {
      moves = 0;
      document.getElementById('movesText').textContent = '0';
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');

      tiles = [...EMOJIS].sort(() => Math.random() - 0.5);
      render();
    }

    function render() {
      const bEl = document.getElementById('board');
      bEl.innerHTML = '';

      tiles.forEach((item, idx) => {
        const t = document.createElement('div');
        t.className = `tile ${item === '' ? 'empty' : ''}`;
        t.textContent = item;
        t.onclick = () => moveTile(idx);
        bEl.appendChild(t);
      });
    }

    function moveTile(idx) {
      const emptyIdx = tiles.indexOf('');
      const r1 = Math.floor(idx / 3), c1 = idx % 3;
      const r2 = Math.floor(emptyIdx / 3), c2 = emptyIdx % 3;

      if (Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1) {
        tiles[emptyIdx] = tiles[idx];
        tiles[idx] = '';
        moves++;
        document.getElementById('movesText').textContent = moves;
        playSnap();
        render();

        if (tiles.join('') === EMOJIS.join('')) {
          document.getElementById('gameOverScreen').classList.remove('hidden');
        }
      }
    }
  </script>
</body>
</html>
