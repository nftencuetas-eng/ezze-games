<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Math Monster Battle - ezze.games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Outfit', sans-serif; }
    body { background: linear-gradient(180deg, #1e1b4b 0%, #312e81 60%, #4338ca 100%); color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; }
    .game-box { width: 100%; max-width: 480px; background: rgba(15, 23, 42, 0.85); border: 3px solid #6366f1; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); backdrop-filter: blur(10px); }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .stat-badge { background: #1e293b; border: 1.5px solid #4f46e5; padding: 6px 14px; border-radius: 12px; font-weight: 800; font-size: 14px; color: #facc15; }
    .monster-arena { background: linear-gradient(180deg, #4338ca 0%, #1e1b4b 100%); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; border: 2px solid #6366f1; position: relative; overflow: hidden; }
    .monster-avatar { font-size: 80px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5)); animation: bounce 2s infinite ease-in-out; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .monster-name { font-family: 'Bungee'; font-size: 18px; color: #f43f5e; }
    .hp-bar-wrap { width: 100%; max-width: 240px; height: 16px; background: #0f172a; border-radius: 10px; overflow: hidden; border: 2px solid #fff; }
    .hp-bar-fill { height: 100%; background: linear-gradient(90deg, #ef4444, #22c55e); width: 100%; transition: width 0.3s ease; }
    .question-card { background: #0f172a; border: 2px solid #facc15; border-radius: 14px; padding: 16px; text-align: center; font-family: 'Bungee'; font-size: 32px; color: #facc15; letter-spacing: 2px; text-shadow: 0 0 10px rgba(250, 204, 21, 0.4); }
    .answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-ans { background: #312e81; border: 2px solid #6366f1; color: #fff; font-family: 'Bungee'; font-size: 24px; padding: 14px; border-radius: 14px; cursor: pointer; transition: transform 0.1s, background 0.1s; }
    .btn-ans:active { transform: scale(0.95); }
    .btn-ans.correct { background: #22c55e !important; border-color: #4ade80 !important; color: #000; }
    .btn-ans.wrong { background: #ef4444 !important; border-color: #f87171 !important; }
    .overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 20px; z-index: 50; }
    .overlay.hidden { display: none; }
    .btn-play { background: #facc15; color: #000; font-family: 'Bungee'; font-size: 22px; padding: 14px 40px; border: none; border-radius: 16px; cursor: pointer; box-shadow: 0 6px 0 #ca8a04; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <div class="stat-badge">⭐ PUNTOS: <span id="scoreText">0</span></div>
      <div class="stat-badge">🏆 OLEADA: <span id="waveText">1</span></div>
    </div>
    <div class="monster-arena">
      <div class="monster-name" id="monsterName">DRAGÓN DE FUEGO</div>
      <div class="monster-avatar" id="monsterAvatar">🐲</div>
      <div class="hp-bar-wrap">
        <div class="hp-bar-fill" id="hpFill"></div>
      </div>
    </div>
    <div class="question-card" id="questionText">7 + 5 = ?</div>
    <div class="answers-grid" id="answersGrid"></div>
  </div>

  <div class="overlay" id="startScreen">
    <h1 style="font-family: 'Bungee'; font-size: 38px; color: #facc15; text-shadow: 0 0 20px rgba(250, 204, 21, 0.6);">MATH MONSTERS</h1>
    <p style="font-size: 16px; color: #cbd5e1; max-width: 320px;">¡Resuelve operaciones matemáticas rápidas para lanzar ataques mágicos y derrotar monstruos!</p>
    <button class="btn-play" onclick="startGame()">¡A BATALLAR!</button>
  </div>

  <div class="overlay hidden" id="gameOverScreen">
    <h1 style="font-family: 'Bungee'; font-size: 34px; color: #10b981;">🎉 ¡VICTORIA TOTAL! 🎉</h1>
    <p style="font-size: 18px; color: #cbd5e1;">Puntos conseguidos: <strong id="finalScore" style="color: #facc15;">0</strong></p>
    <button class="btn-play" onclick="startGame()">JUGAR DE NUEVO</button>
  </div>

  <script>
    const MONSTERS = [
      { name: 'Slime Saltarín', avatar: '🟢', maxHp: 3 },
      { name: 'Duende Travieso', avatar: '👺', maxHp: 4 },
      { name: 'Esqueleto Mágico', avatar: '💀', maxHp: 5 },
      { name: 'Ogro Furioso', avatar: '👹', maxHp: 6 },
      { name: 'Dragón Legendario', avatar: '🐲', maxHp: 8 }
    ];

    let currentMonsterIdx = 0;
    let monsterHp = 3;
    let score = 0;
    let currentAnswer = 0;

    let audioCtx = null;
    function playTone(freq, type = 'sine', dur = 0.15) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
      } catch(e){}
    }

    function startGame() {
      currentMonsterIdx = 0;
      score = 0;
      document.getElementById('scoreText').textContent = '0';
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      loadMonster();
    }

    function loadMonster() {
      if (currentMonsterIdx >= MONSTERS.length) {
        document.getElementById('finalScore').textContent = score;
        document.getElementById('gameOverScreen').classList.remove('hidden');
        return;
      }

      const m = MONSTERS[currentMonsterIdx];
      monsterHp = m.maxHp;
      document.getElementById('monsterName').textContent = m.name;
      document.getElementById('monsterAvatar').textContent = m.avatar;
      document.getElementById('waveText').textContent = (currentMonsterIdx + 1) + '/' + MONSTERS.length;
      updateHpBar();
      nextQuestion();
    }

    function updateHpBar() {
      const m = MONSTERS[currentMonsterIdx];
      const pct = (monsterHp / m.maxHp) * 100;
      document.getElementById('hpFill').style.width = pct + '%';
    }

    function nextQuestion() {
      const ops = ['+', '-', '×'];
      const op = ops[Math.floor(Math.random() * (currentMonsterIdx > 2 ? 3 : 2))];
      let a, b;

      if (op === '+') {
        a = Math.floor(Math.random() * 12) + 1;
        b = Math.floor(Math.random() * 12) + 1;
        currentAnswer = a + b;
      } else if (op === '-') {
        a = Math.floor(Math.random() * 15) + 5;
        b = Math.floor(Math.random() * a) + 1;
        currentAnswer = a - b;
      } else {
        a = Math.floor(Math.random() * 8) + 2;
        b = Math.floor(Math.random() * 8) + 2;
        currentAnswer = a * b;
      }

      document.getElementById('questionText').textContent = `${a} ${op} ${b} = ?`;

      // Opciones
      let options = [currentAnswer];
      while (options.length < 4) {
        const fake = currentAnswer + (Math.floor(Math.random() * 9) - 4);
        if (fake >= 0 && !options.includes(fake)) options.push(fake);
      }
      options.sort(() => Math.random() - 0.5);

      const grid = document.getElementById('answersGrid');
      grid.innerHTML = '';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-ans';
        btn.textContent = opt;
        btn.onclick = () => checkAnswer(btn, opt);
        grid.appendChild(btn);
      });
    }

    function checkAnswer(btn, chosen) {
      const isCorrect = chosen === currentAnswer;
      if (isCorrect) {
        btn.classList.add('correct');
        playTone(600, 'triangle', 0.1);
        setTimeout(() => playTone(900, 'triangle', 0.2), 100);
        score += 50;
        monsterHp -= 1;
        document.getElementById('scoreText').textContent = score;
        updateHpBar();

        setTimeout(() => {
          if (monsterHp <= 0) {
            currentMonsterIdx++;
            loadMonster();
          } else {
            nextQuestion();
          }
        }, 400);
      } else {
        btn.classList.add('wrong');
        playTone(200, 'sawtooth', 0.25);
      }
    }
  </script>
</body>
</html>
