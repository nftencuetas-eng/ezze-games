<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Animal Safari Memory Match - ezze.games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Outfit', sans-serif; }
    body { background: linear-gradient(180deg, #064e3b 0%, #047857 60%, #10b981 100%); color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; }
    .game-box { width: 100%; max-width: 480px; background: rgba(6, 78, 59, 0.85); border: 3px solid #34d399; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); backdrop-filter: blur(10px); }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .stat-badge { background: #065f46; border: 1.5px solid #6ee7b7; padding: 6px 14px; border-radius: 12px; font-weight: 800; font-size: 14px; color: #fef08a; }
    .cards-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; perspective: 1000px; }
    .card { aspect-ratio: 1; background: #047857; border: 2.5px solid #6ee7b7; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 40px; cursor: pointer; transform-style: preserve-3d; transition: transform 0.3s ease, background 0.3s; box-shadow: 0 6px 15px rgba(0,0,0,0.3); }
    .card.hidden-card { background: #065f46; border-color: #34d399; }
    .card.hidden-card span { display: none; }
    .card.matched { background: #059669; border-color: #facc15; animation: pulse 0.5s ease; cursor: default; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    .overlay { position: fixed; inset: 0; background: rgba(6, 78, 59, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 20px; z-index: 50; }
    .overlay.hidden { display: none; }
    .btn-play { background: #facc15; color: #000; font-family: 'Bungee'; font-size: 22px; padding: 14px 40px; border: none; border-radius: 16px; cursor: pointer; box-shadow: 0 6px 0 #ca8a04; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <div class="stat-badge">⏱️ TIEMPO: <span id="timerText">0s</span></div>
      <div class="stat-badge">⭐ PAREJAS: <span id="matchText">0/8</span></div>
    </div>
    <div class="cards-grid" id="cardsGrid"></div>
  </div>

  <div class="overlay" id="startScreen">
    <h1 style="font-family: 'Bungee'; font-size: 36px; color: #facc15; text-shadow: 0 0 20px rgba(250, 204, 21, 0.6);">SAFARI MEMORY</h1>
    <p style="font-size: 16px; color: #d1fae5; max-width: 320px;">¡Encuentra todas las parejas de animales del safari en el menor tiempo posible!</p>
    <button class="btn-play" onclick="startGame()">¡JUGAR AHORA!</button>
  </div>

  <div class="overlay hidden" id="gameOverScreen">
    <h1 style="font-family: 'Bungee'; font-size: 34px; color: #facc15;">🏆 ¡SAFARI COMPLETADO! 🏆</h1>
    <p style="font-size: 18px; color: #d1fae5;">Tiempo récord: <strong id="finalTime" style="color: #6ee7b7;">0s</strong></p>
    <button class="btn-play" onclick="startGame()">JUGAR OTRA VEZ</button>
  </div>

  <script>
    const ANIMALS = ['🦁', '🐘', '🦒', '🦓', '🐵', '🐼', '🐯', '🦘'];
    let cards = [];
    let flipped = [];
    let matchedCount = 0;
    let timer = 0;
    let timerInterval = null;

    let audioCtx = null;
    function playTone(freq, dur = 0.15) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
      } catch(e){}
    }

    function startGame() {
      cards = [...ANIMALS, ...ANIMALS].sort(() => Math.random() - 0.5);
      flipped = [];
      matchedCount = 0;
      timer = 0;
      document.getElementById('matchText').textContent = '0/8';
      document.getElementById('timerText').textContent = '0s';
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timer++;
        document.getElementById('timerText').textContent = timer + 's';
      }, 1000);

      render();
    }

    function render() {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      cards.forEach((animal, idx) => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card hidden-card';
        cardEl.innerHTML = `<span>${animal}</span>`;
        cardEl.onclick = () => flipCard(cardEl, idx, animal);
        grid.appendChild(cardEl);
      });
    }

    function flipCard(el, idx, animal) {
      if (flipped.length >= 2 || !el.classList.contains('hidden-card')) return;

      el.classList.remove('hidden-card');
      playTone(450, 0.08);
      flipped.push({ el, idx, animal });

      if (flipped.length === 2) {
        if (flipped[0].animal === flipped[1].animal) {
          // Pareja correcta
          setTimeout(() => {
            flipped[0].el.classList.add('matched');
            flipped[1].el.classList.add('matched');
            playTone(800, 0.1);
            setTimeout(() => playTone(1200, 0.2), 100);
            matchedCount++;
            document.getElementById('matchText').textContent = matchedCount + '/8';
            flipped = [];

            if (matchedCount === 8) {
              clearInterval(timerInterval);
              document.getElementById('finalTime').textContent = timer + 's';
              document.getElementById('gameOverScreen').classList.remove('hidden');
            }
          }, 300);
        } else {
          // Fallo
          setTimeout(() => {
            flipped[0].el.classList.add('hidden-card');
            flipped[1].el.classList.add('hidden-card');
            flipped = [];
          }, 700);
        }
      }
    }
  </script>
</body>
</html>
