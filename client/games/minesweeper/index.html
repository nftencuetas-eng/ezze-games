<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Buscaminas Retro - ezze.games</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Outfit', sans-serif; }
    body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; }
    .window { background: #1e293b; border: 3px solid #475569; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
    .hud { background: #0f172a; border: 2px solid #334155; padding: 8px 14px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
    .counter { font-size: 24px; font-weight: 900; color: #ef4444; font-family: monospace; background: #000; padding: 2px 10px; border-radius: 6px; }
    .btn-face { font-size: 28px; background: none; border: none; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(9, 36px); grid-template-rows: repeat(9, 36px); gap: 4px; background: #0f172a; padding: 8px; border-radius: 10px; }
    .cell { width: 36px; height: 36px; background: #334155; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; cursor: pointer; transition: background 0.1s; }
    .cell:hover { background: #475569; }
    .cell.revealed { background: #020617; }
    .cell.flag { color: #ef4444; }
    .mode-toggle { display: flex; justify-content: center; gap: 10px; margin-top: 8px; }
    .btn-mode { background: #334155; border: 1.5px solid #64748b; color: #fff; padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .btn-mode.active { background: #3b82f6; border-color: #60a5fa; }
  </style>
</head>
<body>
  <div class="window">
    <div class="hud">
      <div class="counter" id="mineCount">010</div>
      <button class="btn-face" id="btnFace" onclick="initMinesweeper()">🙂</button>
      <div class="counter" id="timer">000</div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="mode-toggle">
      <button class="btn-mode active" id="btnModeDig" onclick="setMode('dig')">⛏️ Excavar</button>
      <button class="btn-mode" id="btnModeFlag" onclick="setMode('flag')">🚩 Bandera</button>
    </div>
  </div>

  <script>
    const ROWS = 9, COLS = 9, MINES = 10;
    let board = [], revealed = [], flags = [];
    let gameOver = false, gameWon = false;
    let time = 0, timerInterval = null;
    let mode = 'dig'; // 'dig' o 'flag'

    const NUM_COLORS = ['', '#3b82f6', '#22c55e', '#ef4444', '#a855f7', '#f97316', '#06b6d4', '#000', '#64748b'];

    function setMode(m) {
      mode = m;
      document.getElementById('btnModeDig').classList.toggle('active', m === 'dig');
      document.getElementById('btnModeFlag').classList.toggle('active', m === 'flag');
    }

    function initMinesweeper() {
      board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      revealed = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
      flags = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
      gameOver = false;
      gameWon = false;
      document.getElementById('btnFace').textContent = '🙂';
      document.getElementById('mineCount').textContent = '010';

      clearInterval(timerInterval);
      time = 0;
      document.getElementById('timer').textContent = '000';

      // Colocar minas
      let placed = 0;
      while (placed < MINES) {
        const r = Math.floor(Math.random() * ROWS);
        const c = Math.floor(Math.random() * COLS);
        if (board[r][c] !== 'M') {
          board[r][c] = 'M';
          placed++;
        }
      }

      // Calcular números
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c] === 'M') continue;
          let count = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc] === 'M') count++;
            }
          }
          board[r][c] = count;
        }
      }

      render();
    }

    function startTimer() {
      if (!timerInterval) {
        timerInterval = setInterval(() => {
          time++;
          document.getElementById('timer').textContent = String(Math.min(999, time)).padStart(3, '0');
        }, 1000);
      }
    }

    function render() {
      const gEl = document.getElementById('grid');
      gEl.innerHTML = '';

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';

          if (revealed[r][c]) {
            cell.classList.add('revealed');
            const val = board[r][c];
            if (val === 'M') {
              cell.textContent = '💣';
              cell.style.background = '#ef4444';
            } else if (val > 0) {
              cell.textContent = val;
              cell.style.color = NUM_COLORS[val];
            }
          } else if (flags[r][c]) {
            cell.classList.add('flag');
            cell.textContent = '🚩';
          }

          cell.addEventListener('click', () => handleClick(r, c));
          cell.addEventListener('contextmenu', (e) => { e.preventDefault(); toggleFlag(r, c); });
          gEl.appendChild(cell);
        }
      }
    }

    function handleClick(r, c) {
      if (gameOver || gameWon || revealed[r][c]) return;
      startTimer();

      if (mode === 'flag') {
        toggleFlag(r, c);
        return;
      }

      if (flags[r][c]) return;

      if (board[r][c] === 'M') {
        // Explotó
        gameOver = true;
        clearInterval(timerInterval);
        document.getElementById('btnFace').textContent = '😵';
        // Revelar todas las minas
        for (let i = 0; i < ROWS; i++) {
          for (let j = 0; j < COLS; j++) {
            if (board[i][j] === 'M') revealed[i][j] = true;
          }
        }
        render();
        return;
      }

      reveal(r, c);
      checkWin();
      render();
    }

    function reveal(r, c) {
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS || revealed[r][c] || flags[r][c]) return;
      revealed[r][c] = true;

      if (board[r][c] === 0) {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            reveal(r + dr, c + dc);
          }
        }
      }
    }

    function toggleFlag(r, c) {
      if (revealed[r][c] || gameOver || gameWon) return;
      flags[r][c] = !flags[r][c];
      const flaggedCount = flags.flat().filter(f => f).length;
      document.getElementById('mineCount').textContent = String(Math.max(0, MINES - flaggedCount)).padStart(3, '0');
      render();
    }

    function checkWin() {
      let unrevealedSafe = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c] !== 'M' && !revealed[r][c]) unrevealedSafe++;
        }
      }
      if (unrevealedSafe === 0) {
        gameWon = true;
        clearInterval(timerInterval);
        document.getElementById('btnFace').textContent = '😎';
      }
    }

    initMinesweeper();
  </script>
</body>
</html>
