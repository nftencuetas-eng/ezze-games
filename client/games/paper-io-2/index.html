<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Paper.io 2 Battle - ezze.games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/orientation.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; }
    body { background: #0f172a; color: #fff; font-family: 'Bungee', sans-serif; overflow: hidden; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #canvasContainer { position: relative; width: 100%; height: 100%; }
    canvas { width: 100%; height: 100%; display: block; background: #f8fafc; }
    .hud { position: absolute; top: 16px; left: 20px; right: 20px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
    .hud-box { background: rgba(15, 23, 42, 0.85); border: 2px solid #8b5cf6; padding: 8px 18px; border-radius: 14px; font-size: 16px; color: #8b5cf6; }
    .gameover-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 100; }
    .gameover-screen.hidden { display: none; }
    .btn-play { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff; font-family: 'Bungee', cursive; font-size: 20px; padding: 14px 34px; border: none; border-radius: 14px; cursor: pointer; box-shadow: 0 8px 0 #5b21b6; }
  </style>
</head>
<body>
  <div id="canvasContainer">
    <div class="hud">
      <div class="hud-box">TERRITORIO: <span id="areaText">1.2%</span></div>
      <div class="hud-box" style="border-color: #ef4444; color: #ef4444;">⚔️ KILLS: <span id="killsText">0</span></div>
    </div>
    <canvas id="paperCanvas"></canvas>
    <div class="gameover-screen hidden" id="gameOver">
      <h1 style="font-size: 38px; color: #ef4444; text-shadow: 0 0 25px rgba(239, 68, 68, 0.8);">¡CORTARON TU COLA!</h1>
      <p style="font-family: 'Outfit', sans-serif; font-size: 18px; color: #94a3b8;">Territorio conquistado: <strong id="finalArea" style="color: #8b5cf6;">0%</strong></p>
      <button class="btn-play" id="btnRestart">JUGAR DE NUEVO 🔄</button>
    </div>
  </div>

  <script src="../../js/orientation.js"></script>
  <script>
    new OrientationLock({ requiresLandscape: true, onOrientationChange: () => resize() });

    const canvas = document.getElementById('paperCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    const WORLD_SIZE = 2400;
    let player = {
      x: WORLD_SIZE / 2, y: WORLD_SIZE / 2,
      vx: 4.5, vy: 0,
      color: '#8b5cf6',
      trail: [],
      territory: [],
      kills: 0,
      areaPct: 1.2
    };

    let bots = [];
    let gameOver = false;

    function initGame() {
      player = {
        x: WORLD_SIZE / 2, y: WORLD_SIZE / 2,
        vx: 4.5, vy: 0,
        color: '#8b5cf6',
        trail: [],
        territory: [],
        kills: 0,
        areaPct: 1.2
      };

      // Territorio inicial
      for (let x = player.x - 40; x <= player.x + 40; x += 10) {
        for (let y = player.y - 40; y <= player.y + 40; y += 10) {
          player.territory.push({ x, y });
        }
      }

      // Bots
      bots = [];
      const botColors = ['#ef4444', '#10b981', '#f59e0b', '#ec4899'];
      for (let i = 0; i < 4; i++) {
        const bx = Math.random() * (WORLD_SIZE - 400) + 200;
        const by = Math.random() * (WORLD_SIZE - 400) + 200;
        bots.push({
          x: bx, y: by,
          vx: 4, vy: 0,
          color: botColors[i],
          trail: [],
          territory: [{ x: bx, y: by }]
        });
      }

      gameOver = false;
      document.getElementById('areaText').textContent = '1.2%';
      document.getElementById('killsText').textContent = '0';
      document.getElementById('gameOver').classList.add('hidden');
    }

    // Controles
    function setDirection(dx, dy) {
      if (gameOver) return;
      if (player.vx !== -dx * 4.5 && player.vy !== -dy * 4.5) {
        player.vx = dx * 4.5;
        player.vy = dy * 4.5;
      }
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'ArrowUp' || e.code === 'KeyW') setDirection(0, -1);
      if (e.code === 'ArrowDown' || e.code === 'KeyS') setDirection(0, 1);
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') setDirection(-1, 0);
      if (e.code === 'ArrowRight' || e.code === 'KeyD') setDirection(1, 0);
    });

    // Touch / Mouse steering
    window.addEventListener('mousemove', e => {
      if (!gameOver) {
        const dx = e.clientX - width / 2;
        const dy = e.clientY - height / 2;
        const angle = Math.atan2(dy, dx);
        player.vx = Math.cos(angle) * 4.5;
        player.vy = Math.sin(angle) * 4.5;
      }
    });

    document.getElementById('btnRestart').addEventListener('click', initGame);

    function update() {
      if (gameOver) return;

      player.x += player.vx;
      player.y += player.vy;

      // Límites del mundo
      if (player.x < 20 || player.x > WORLD_SIZE - 20 || player.y < 20 || player.y > WORLD_SIZE - 20) {
        triggerGameOver();
      }

      // Dejar rastro
      player.trail.push({ x: player.x, y: player.y });

      // Si entra a su territorio, cerrar rastro
      const inHome = player.territory.some(p => Math.hypot(p.x - player.x, p.y - player.y) < 25);
      if (inHome && player.trail.length > 15) {
        player.territory.push(...player.trail);
        player.trail = [];
        player.areaPct = Math.min(100, (player.territory.length * 0.08)).toFixed(1);
        document.getElementById('areaText').textContent = `${player.areaPct}%`;
      }

      // Mover Bots
      bots.forEach(b => {
        if (Math.random() < 0.04) {
          const angle = Math.random() * Math.PI * 2;
          b.vx = Math.cos(angle) * 4;
          b.vy = Math.sin(angle) * 4;
        }
        b.x += b.vx;
        b.y += b.vy;
        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > 50) b.trail.shift();

        // Bot corta la cola del jugador
        player.trail.forEach(pt => {
          if (Math.hypot(b.x - pt.x, b.y - pt.y) < 14) {
            triggerGameOver();
          }
        });
      });
    }

    function triggerGameOver() {
      gameOver = true;
      document.getElementById('finalArea').textContent = `${player.areaPct}%`;
      document.getElementById('gameOver').classList.remove('hidden');
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      ctx.save();
      ctx.translate(width / 2 - player.x, height / 2 - player.y);

      // Fondo y límites
      ctx.fillStyle = '#f1f5f9';
      ctx.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE);
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 10;
      ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

      // Territorio conquistado
      ctx.fillStyle = 'rgba(139, 92, 246, 0.35)';
      player.territory.forEach(p => {
        ctx.fillRect(p.x - 8, p.y - 8, 16, 16);
      });

      // Cola activa del jugador
      ctx.strokeStyle = '#8b5cf6';
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.beginPath();
      if (player.trail.length > 0) {
        ctx.moveTo(player.trail[0].x, player.trail[0].y);
        for (let i = 1; i < player.trail.length; i++) {
          ctx.lineTo(player.trail[i].x, player.trail[i].y);
        }
        ctx.stroke();
      }

      // Bots
      bots.forEach(b => {
        ctx.strokeStyle = b.color;
        ctx.lineWidth = 10;
        ctx.beginPath();
        if (b.trail.length > 0) {
          ctx.moveTo(b.trail[0].x, b.trail[0].y);
          for (let i = 1; i < b.trail.length; i++) ctx.lineTo(b.trail[i].x, b.trail[i].y);
          ctx.stroke();
        }
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x - 14, b.y - 14, 28, 28);
      });

      // Cabeza del Jugador
      ctx.fillStyle = '#8b5cf6';
      ctx.fillRect(player.x - 14, player.y - 14, 28, 28);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(player.x - 14, player.y - 14, 28, 28);

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    initGame();
    loop();
  </script>
</body>
</html>
