<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Duelo 2 Jugadores 1vs1 - ezze.games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; font-family: 'Bungee', cursive; }
    body { background: #020617; color: #fff; width: 100vw; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    #canvasWrap { position: relative; width: 100%; height: 100%; max-width: 440px; max-height: 700px; box-shadow: 0 0 40px rgba(56, 189, 248, 0.4); border: 3px solid #38bdf8; border-radius: 20px; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; background: #090d16; }
    .hud-scores { position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-50%); display: flex; justify-content: space-between; padding: 0 20px; font-size: 32px; pointer-events: none; z-index: 10; opacity: 0.7; }
    .overlay { position: absolute; inset: 0; background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 20px; z-index: 30; }
    .overlay.hidden { display: none; }
    .btn-play { background: #38bdf8; color: #000; font-family: 'Bungee'; font-size: 20px; padding: 14px 36px; border: none; border-radius: 16px; cursor: pointer; box-shadow: 0 6px 0 #0284c7; }
  </style>
</head>
<body>
  <div id="canvasWrap">
    <div class="hud-scores">
      <div style="color: #ef4444;" id="p1Score">🔴 0</div>
      <div style="color: #38bdf8;" id="p2Score">0 🔵</div>
    </div>
    <canvas id="duelCanvas" width="360" height="580"></canvas>
    <div class="overlay" id="startScreen">
      <h1 style="font-size: 34px; color: #38bdf8;">DUELO 2 JUGADORES</h1>
      <p style="font-family: 'Outfit'; font-size: 15px; color: #cbd5e1; max-width: 320px;">¡Juega con un amigo o familiar en la misma pantalla! Desliza tu disco para meter gol en el arco rival.</p>
      <button class="btn-play" onclick="startGame()">¡A COMPETIR!</button>
    </div>
    <div class="overlay hidden" id="winScreen">
      <h1 style="font-size: 32px; color: #facc15;" id="winnerText">🏆 ¡GANADOR! 🏆</h1>
      <button class="btn-play" onclick="startGame()">REVANCHA</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('duelCanvas');
    const ctx = canvas.getContext('2d');

    let p1 = { x: 180, y: 80, r: 24, color: '#ef4444' };
    let p2 = { x: 180, y: 500, r: 24, color: '#38bdf8' };
    let puck = { x: 180, y: 290, vx: 0, vy: 0, r: 16 };

    let p1Score = 0, p2Score = 0;
    let isPlaying = false;

    let audioCtx = null;
    function playHit(freq) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
      } catch(e){}
    }

    function resetPuck() {
      puck = { x: 180, y: 290, vx: (Math.random() - 0.5) * 4, vy: (Math.random() > 0.5 ? 4 : -4), r: 16 };
    }

    function startGame() {
      p1Score = 0;
      p2Score = 0;
      document.getElementById('p1Score').textContent = '🔴 0';
      document.getElementById('p2Score').textContent = '0 🔵';
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('winScreen').classList.add('hidden');
      resetPuck();
      isPlaying = true;
    }

    function update() {
      if (!isPlaying) return;

      puck.x += puck.vx;
      puck.y += puck.vy;
      puck.vx *= 0.99;
      puck.vy *= 0.99;

      // Paredes laterales
      if (puck.x - puck.r < 0 || puck.x + puck.r > canvas.width) {
        puck.vx *= -1;
        playHit(400);
      }

      // Gol P2 (Entra en arco de P1 arriba)
      if (puck.y - puck.r < 0) {
        if (puck.x > 100 && puck.x < 260) {
          p2Score++;
          document.getElementById('p2Score').textContent = `${p2Score} 🔵`;
          playHit(800);
          if (p2Score >= 5) return endMatch('¡GANÓ EL JUGADOR AZUL! 🔵');
          resetPuck();
        } else {
          puck.vy *= -1;
          playHit(400);
        }
      }

      // Gol P1 (Entra en arco de P2 abajo)
      if (puck.y + puck.r > canvas.height) {
        if (puck.x > 100 && puck.x < 260) {
          p1Score++;
          document.getElementById('p1Score').textContent = `🔴 ${p1Score}`;
          playHit(800);
          if (p1Score >= 5) return endMatch('¡GANÓ EL JUGADOR ROJO! 🔴');
          resetPuck();
        } else {
          puck.vy *= -1;
          playHit(400);
        }
      }

      // Colisión con Paleta P1
      if (Math.hypot(puck.x - p1.x, puck.y - p1.y) < puck.r + p1.r) {
        puck.vx = (puck.x - p1.x) * 0.35;
        puck.vy = (puck.y - p1.y) * 0.35;
        playHit(600);
      }

      // Colisión con Paleta P2
      if (Math.hypot(puck.x - p2.x, puck.y - p2.y) < puck.r + p2.r) {
        puck.vx = (puck.x - p2.x) * 0.35;
        puck.vy = (puck.y - p2.y) * 0.35;
        playHit(600);
      }
    }

    function endMatch(winner) {
      isPlaying = false;
      document.getElementById('winnerText').textContent = winner;
      document.getElementById('winScreen').classList.remove('hidden');
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Línea central y círculo
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, canvas.height / 2); ctx.lineTo(canvas.width, canvas.height / 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2, 50, 0, Math.PI * 2); ctx.stroke();

      // Arcos
      ctx.strokeStyle = '#ef4444';
      ctx.strokeRect(100, 0, 160, 10);
      ctx.strokeStyle = '#38bdf8';
      ctx.strokeRect(100, canvas.height - 10, 160, 10);

      // Paletas
      ctx.fillStyle = p1.color;
      ctx.beginPath(); ctx.arc(p1.x, p1.y, p1.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();

      ctx.fillStyle = p2.color;
      ctx.beginPath(); ctx.arc(p2.x, p2.y, p2.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();

      // Disco Neón
      ctx.fillStyle = '#facc15';
      ctx.beginPath(); ctx.arc(puck.x, puck.y, puck.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    }

    function handleTouch(e) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      for (let i = 0; i < e.touches.length; i++) {
        const t = e.touches[i];
        const tx = (t.clientX - rect.left) * scaleX;
        const ty = (t.clientY - rect.top) * scaleY;

        if (ty < canvas.height / 2) {
          p1.x = Math.max(p1.r, Math.min(canvas.width - p1.r, tx));
          p1.y = Math.max(p1.r, Math.min(canvas.height / 2 - p1.r, ty));
        } else {
          p2.x = Math.max(p2.r, Math.min(canvas.width - p2.r, tx));
          p2.y = Math.max(canvas.height / 2 + p2.r, Math.min(canvas.height - p2.r, ty));
        }
      }
    }

    canvas.addEventListener('touchmove', handleTouch, { passive: false });
    canvas.addEventListener('touchstart', handleTouch, { passive: false });

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      p2.x = (e.clientX - rect.left) * (canvas.width / rect.width);
      p2.y = Math.max(canvas.height / 2 + p2.r, (e.clientY - rect.top) * (canvas.height / rect.height));
    });

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
