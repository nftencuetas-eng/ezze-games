<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Neon 2048 Master</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    .header { display: flex; justify-content: space-between; width: 360px; margin-bottom: 16px; align-items: center; }
    .score-box { background: #1e293b; padding: 8px 16px; border-radius: 10px; border: 1px solid #334155; font-weight: bold; }
    #board { width: 360px; height: 360px; background: #1e293b; border-radius: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .tile { background: #334155; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; color: #fff; transition: transform 0.1s ease; }
    .t-2 { background: #0ea5e9; }
    .t-4 { background: #06b6d4; }
    .t-8 { background: #10b981; }
    .t-16 { background: #84cc16; }
    .t-32 { background: #f59e0b; }
    .t-64 { background: #f97316; }
    .t-128 { background: #ef4444; box-shadow: 0 0 15px #ef4444; }
    .t-256 { background: #ec4899; box-shadow: 0 0 20px #ec4899; }
    .t-512 { background: #8b5cf6; box-shadow: 0 0 25px #8b5cf6; }
    .t-1024 { background: #d946ef; box-shadow: 0 0 30px #d946ef; }
    .t-2048 { background: #eab308; box-shadow: 0 0 40px #eab308; font-size: 20px; }
  </style>
</head>
<body>
  <div class="header">
    <h2 style="color: #0ea5e9;">2048 MASTER</h2>
    <div class="score-box">PUNTOS: <span id="score" style="color: #f59e0b;">0</span></div>
  </div>
  <div id="board"></div>

  <script>
    let grid = Array(4).fill().map(() => Array(4).fill(0));
    let score = 0;

    function init() {
      grid = Array(4).fill().map(() => Array(4).fill(0));
      score = 0;
      addRandomTile();
      addRandomTile();
      render();
    }

    function addRandomTile() {
      let empty = [];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (grid[r][c] === 0) empty.push({ r, c });
        }
      }
      if (empty.length > 0) {
        let spot = empty[Math.floor(Math.random() * empty.length)];
        grid[spot.r][spot.c] = Math.random() < 0.9 ? 2 : 4;
      }
    }

    function render() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      document.getElementById('score').textContent = score;

      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const val = grid[r][c];
          const div = document.createElement('div');
          div.className = `tile ${val ? `t-${val}` : ''}`;
          div.textContent = val ? val : '';
          board.appendChild(div);
        }
      }
    }

    function slide(row) {
      let arr = row.filter(v => v !== 0);
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
          arr[i] *= 2;
          score += arr[i];
          arr[i + 1] = 0;
        }
      }
      arr = arr.filter(v => v !== 0);
      while (arr.length < 4) arr.push(0);
      return arr;
    }

    function move(dir) {
      let changed = false;
      let prev = JSON.stringify(grid);

      if (dir === 'left') {
        for (let r = 0; r < 4; r++) grid[r] = slide(grid[r]);
      } else if (dir === 'right') {
        for (let r = 0; r < 4; r++) grid[r] = slide(grid[r].reverse()).reverse();
      } else if (dir === 'up') {
        for (let c = 0; c < 4; c++) {
          let col = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]];
          col = slide(col);
          for (let r = 0; r < 4; r++) grid[r][c] = col[r];
        }
      } else if (dir === 'down') {
        for (let c = 0; c < 4; c++) {
          let col = [grid[3][c], grid[2][c], grid[1][c], grid[0][c]];
          col = slide(col);
          for (let r = 0; r < 4; r++) grid[3 - r][c] = col[r];
        }
      }

      if (prev !== JSON.stringify(grid)) {
        addRandomTile();
        render();
      }
    }

    window.addEventListener('keydown', e => {
      if (['ArrowLeft', 'a'].includes(e.key)) move('left');
      if (['ArrowRight', 'd'].includes(e.key)) move('right');
      if (['ArrowUp', 'w'].includes(e.key)) move('up');
      if (['ArrowDown', 's'].includes(e.key)) move('down');
    });

    init();
  </script>
</body>
</html>
