<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Leyenda del Reino Dorado</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: #fff; overflow: hidden; }
    #canvas { border: 4px solid #f1c40f; border-radius: 12px; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .hud { margin-bottom: 10px; font-size: 18px; display: flex; gap: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="hud">
    <span>❤️ Vidas: <span id="hearts" style="color: #e74c3c;">❤️❤️❤️</span></span>
    <span>💎 Gemas: <span id="gems" style="color: #3b82f6;">0</span></span>
    <span>🗝️ Llave: <span id="keyStatus" style="color: #f1c40f;">No</span></span>
  </div>
  <canvas id="canvas" width="800" height="500"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let currentRoom = 1; // 1: Bosque, 2: Cueva, 3: Castillo
    let player = { x: 50, y: 220, size: 28, speed: 4.5, hp: 3, gems: 0, hasKey: false, won: false };
    let keys = {};
    let enemies = [];
    let items = [];

    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    function initRoom(r) {
      currentRoom = r;
      enemies = [];
      items = [];

      if (r === 1) {
        player.x = 50; player.y = 220;
        items.push({ type: 'key', x: 400, y: 150, size: 20, collected: player.hasKey });
        items.push({ type: 'gem', x: 250, y: 350, size: 16, collected: false });
        items.push({ type: 'gem', x: 600, y: 180, size: 16, collected: false });
      } else if (r === 2) {
        player.x = 50; player.y = 220;
        enemies.push({ x: 300, y: 100, vy: 3, size: 24, type: 'bat' });
        enemies.push({ x: 500, y: 380, vy: -3, size: 24, type: 'bat' });
        items.push({ type: 'gem', x: 400, y: 250, size: 16, collected: false });
      } else if (r === 3) {
        player.x = 50; player.y = 220;
        items.push({ type: 'chest', x: 680, y: 220, size: 40, collected: false });
      }
    }

    initRoom(1);

    function update() {
      if (player.won || player.hp <= 0) return;

      if (keys['ArrowUp'] || keys['w']) player.y -= player.speed;
      if (keys['ArrowDown'] || keys['s']) player.y += player.speed;
      if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
      if (keys['ArrowRight'] || keys['d']) player.x += player.speed;

      player.x = Math.max(20, Math.min(canvas.width - player.size - 20, player.x));
      player.y = Math.max(20, Math.min(canvas.height - player.size - 20, player.y));

      // Puertas entre salas
      if (player.x >= canvas.width - player.size - 20 && player.y > 180 && player.y < 300) {
        if (currentRoom === 1) initRoom(2);
        else if (currentRoom === 2) {
          if (player.hasKey) initRoom(3);
        }
      }

      // Enemigos
      enemies.forEach(e => {
        e.y += e.vy;
        if (e.y < 50 || e.y > 420) e.vy = -e.vy;
        if (Math.hypot(player.x - e.x, player.y - e.y) < player.size / 2 + e.size / 2) {
          player.hp--;
          document.getElementById('hearts').textContent = '❤️'.repeat(Math.max(0, player.hp));
          player.x = 50; player.y = 220;
        }
      });

      // Items
      items.forEach(it => {
        if (!it.collected && Math.hypot(player.x - it.x, player.y - it.y) < player.size / 2 + it.size / 2) {
          it.collected = true;
          if (it.type === 'key') {
            player.hasKey = true;
            document.getElementById('keyStatus').textContent = '¡Sí! 🗝️';
          } else if (it.type === 'gem') {
            player.gems++;
            document.getElementById('gems').textContent = player.gems;
          } else if (it.type === 'chest') {
            player.won = true;
          }
        }
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Fondo por sala
      if (currentRoom === 1) {
        ctx.fillStyle = '#1b4332';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f1c40f';
        ctx.font = '20px sans-serif';
        ctx.fillText('🌲 Sala 1: Bosque Mágico (Encuentra la llave)', 30, 40);
      } else if (currentRoom === 2) {
        ctx.fillStyle = '#1e1b4b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f1c40f';
        ctx.font = '20px sans-serif';
        ctx.fillText('🦇 Sala 2: Cueva de Murciélagos (Puerta con llave)', 30, 40);
      } else if (currentRoom === 3) {
        ctx.fillStyle = '#4c0519';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f1c40f';
        ctx.font = '20px sans-serif';
        ctx.fillText('👑 Sala 3: Castillo del Tesoro Real', 30, 40);
      }

      // Puerta salida
      ctx.fillStyle = player.hasKey || currentRoom === 1 ? '#f59e0b' : '#64748b';
      ctx.fillRect(canvas.width - 20, 180, 20, 120);

      // Items
      items.forEach(it => {
        if (!it.collected) {
          ctx.font = `${it.size * 1.5}px sans-serif`;
          if (it.type === 'key') ctx.fillText('🗝️', it.x, it.y);
          if (it.type === 'gem') ctx.fillText('💎', it.x, it.y);
          if (it.type === 'chest') ctx.fillText('👑🏆', it.x, it.y);
        }
      });

      // Enemigos
      enemies.forEach(e => {
        ctx.font = `${e.size * 1.5}px sans-serif`;
        ctx.fillText('🦇', e.x, e.y);
      });

      // Jugador
      ctx.font = `${player.size * 1.3}px sans-serif`;
      ctx.fillText('🛡️⚔️', player.x - 10, player.y + 10);

      if (player.won) {
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f1c40f';
        ctx.font = '36px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🏆 ¡VICTORIA! ¡ABRISTE EL COFRE REAL!', canvas.width / 2, canvas.height / 2);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
