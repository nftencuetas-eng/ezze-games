<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sandboxels Simulator - ezze.games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; font-family: 'Outfit', sans-serif; }
    body { background: #090d16; color: #fff; width: 100vw; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
    .header { width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .header h1 { font-family: 'Bungee'; font-size: 22px; color: #facc15; }
    #canvasWrap { position: relative; width: 100%; max-width: 500px; aspect-ratio: 1; border: 2px solid #334155; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
    canvas { width: 100%; height: 100%; display: block; background: #020617; cursor: crosshair; }
    .toolbar { width: 100%; max-width: 500px; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; justify-content: center; }
    .tool-btn { background: #1e293b; border: 2px solid #475569; color: #fff; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .tool-btn.active { border-color: #facc15; background: #334155; color: #facc15; }
  </style>
</head>
<body>
  <div class="header">
    <h1>SANDBOXELS</h1>
    <button class="tool-btn" onclick="clearGrid()">🧹 LIMPIAR</button>
  </div>
  <div id="canvasWrap">
    <canvas id="sandCanvas" width="160" height="160"></canvas>
  </div>
  <div class="toolbar">
    <button class="tool-btn active" data-type="sand">🟡 Arena</button>
    <button class="tool-btn" data-type="water">🔵 Agua</button>
    <button class="tool-btn" data-type="fire">🔥 Fuego</button>
    <button class="tool-btn" data-type="wood">🪵 Madera</button>
    <button class="tool-btn" data-type="stone">🪨 Piedra</button>
    <button class="tool-btn" data-type="plant">🌱 Planta</button>
    <button class="tool-btn" data-type="eraser">❌ Borrar</button>
  </div>

  <script>
    const canvas = document.getElementById('sandCanvas');
    const ctx = canvas.getContext('2d');

    const W = 160, H = 160;
    let grid = Array.from({ length: H }, () => Array(W).fill(0));
    let curType = 'sand';
    let isDrawing = false;

    const COLORS = {
      sand: '#facc15',
      water: '#38bdf8',
      fire: '#ef4444',
      wood: '#78350f',
      stone: '#64748b',
      plant: '#22c55e'
    };

    document.querySelectorAll('.tool-btn[data-type]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tool-btn[data-type]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        curType = btn.getAttribute('data-type');
      });
    });

    function clearGrid() {
      grid = Array.from({ length: H }, () => Array(W).fill(0));
    }

    function addParticle(cx, cy) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      const scaleY = H / rect.height;
      const x = Math.floor((cx - rect.left) * scaleX);
      const y = Math.floor((cy - rect.top) * scaleY);

      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          const nx = x + dx, ny = y + dy;
          if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
            if (curType === 'eraser') grid[ny][nx] = 0;
            else if (grid[ny][nx] === 0 || curType === 'fire') grid[ny][nx] = curType;
          }
        }
      }
    }

    canvas.addEventListener('mousedown', e => { isDrawing = true; addParticle(e.clientX, e.clientY); });
    window.addEventListener('mouseup', () => isDrawing = false);
    canvas.addEventListener('mousemove', e => { if (isDrawing) addParticle(e.clientX, e.clientY); });

    canvas.addEventListener('touchstart', e => { isDrawing = true; if (e.touches.length > 0) addParticle(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    window.addEventListener('touchend', () => isDrawing = false);
    canvas.addEventListener('touchmove', e => { if (isDrawing && e.touches.length > 0) addParticle(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });

    function update() {
      // Simulación física celular
      for (let y = H - 2; y >= 0; y--) {
        for (let x = 0; x < W; x++) {
          const cell = grid[y][x];
          if (!cell || cell === 'stone' || cell === 'wood') continue;

          if (cell === 'sand') {
            if (grid[y + 1][x] === 0 || grid[y + 1][x] === 'water') {
              grid[y][x] = grid[y + 1][x];
              grid[y + 1][x] = 'sand';
            } else {
              const dir = Math.random() > 0.5 ? 1 : -1;
              if (x + dir >= 0 && x + dir < W && grid[y + 1][x + dir] === 0) {
                grid[y][x] = 0;
                grid[y + 1][x + dir] = 'sand';
              }
            }
          } else if (cell === 'water') {
            if (grid[y + 1][x] === 0) {
              grid[y][x] = 0;
              grid[y + 1][x] = 'water';
            } else {
              const dir = Math.random() > 0.5 ? 1 : -1;
              if (x + dir >= 0 && x + dir < W && grid[y][x + dir] === 0) {
                grid[y][x] = 0;
                grid[y][x + dir] = 'water';
              }
            }
          } else if (cell === 'fire') {
            // Fuego consume madera y plantas
            if (Math.random() < 0.2) grid[y][x] = 0;
            [-1, 1].forEach(dx => {
              if (grid[y][x + dx] === 'wood' || grid[y][x + dx] === 'plant') grid[y][x + dx] = 'fire';
            });
          }
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      const imgData = ctx.createImageData(W, H);

      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const type = grid[y][x];
          if (type && COLORS[type]) {
            const idx = (y * W + x) * 4;
            const hex = COLORS[type];
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);

            imgData.data[idx] = r;
            imgData.data[idx + 1] = g;
            imgData.data[idx + 2] = b;
            imgData.data[idx + 3] = 255;
          }
        }
      }

      ctx.putImageData(imgData, 0, 0);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
