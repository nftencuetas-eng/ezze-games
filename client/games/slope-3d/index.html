<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Slope 3D Runner - ezze.games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/orientation.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; }
    body { background: #050811; color: #fff; font-family: 'Bungee', sans-serif; overflow: hidden; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #canvasContainer { position: relative; width: 100%; height: 100%; }
    canvas { width: 100%; height: 100%; display: block; }
    .hud { position: absolute; top: 16px; left: 20px; right: 20px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
    .hud-box { background: rgba(15, 23, 42, 0.85); border: 2px solid #10b981; padding: 8px 18px; border-radius: 14px; font-size: 16px; color: #10b981; text-shadow: 0 0 12px rgba(16, 185, 129, 0.6); }
    .gameover-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(9, 13, 22, 0.92); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 100; }
    .gameover-screen.hidden { display: none; }
    .btn-play { background: linear-gradient(135deg, #10b981, #059669); color: #fff; font-family: 'Bungee', cursive; font-size: 20px; padding: 14px 34px; border: none; border-radius: 14px; cursor: pointer; box-shadow: 0 8px 0 #047857; transition: all 0.1s ease; }
    .btn-play:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div id="canvasContainer">
    <div class="hud">
      <div class="hud-box">PUNTOS: <span id="scoreText">0</span></div>
      <div class="hud-box" style="border-color: #f59e0b; color: #f59e0b;">RÉCORD: <span id="bestText">0</span></div>
    </div>
    <canvas id="slopeCanvas"></canvas>
    <div class="gameover-screen hidden" id="gameOver">
      <h1 style="font-size: 40px; color: #ef4444; text-shadow: 0 0 25px rgba(239, 68, 68, 0.8);">¡CAÍSTE AL VACÍO!</h1>
      <p style="font-family: 'Outfit', sans-serif; font-size: 18px; color: #94a3b8;">Distancia alcanzada: <strong id="finalScore" style="color: #10b981;">0</strong> m</p>
      <button class="btn-play" id="btnRestart">JUGAR DE NUEVO 🔄</button>
    </div>
  </div>

  <script src="../../js/orientation.js"></script>
  <script>
    new OrientationLock({ requiresLandscape: true, onOrientationChange: () => resize() });

    const canvas = document.getElementById('slopeCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Estado del juego
    let ball = { x: 0, y: 0, z: 0, vx: 0, vz: 1.5, r: 14 };
    let track = [];
    let score = 0;
    let best = parseInt(localStorage.getItem('slope_best') || '0');
    document.getElementById('bestText').textContent = best;
    let gameOver = false;
    let keys = {};

    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    // Touch / Mouse controls
    let touchX = null;
    window.addEventListener('touchstart', e => { if (e.touches.length > 0) touchX = e.touches[0].clientX; });
    window.addEventListener('touchmove', e => {
      if (e.touches.length > 0 && touchX !== null) {
        const dx = e.touches[0].clientX - touchX;
        ball.vx = dx * 0.08;
        touchX = e.touches[0].clientX;
      }
    });
    window.addEventListener('touchend', () => { touchX = null; ball.vx = 0; });

    window.addEventListener('mousemove', e => {
      if (!gameOver) {
        const norm = (e.clientX - width / 2) / (width / 2);
        ball.vx = norm * 4;
      }
    });

    function initTrack() {
      track = [];
      let curX = 0, curY = 0, curZ = 0;
      for (let i = 0; i < 60; i++) {
        const segW = 160;
        const segL = 100;
        track.push({
          x: curX, y: curY, z: curZ,
          w: segW, l: segL,
          hasObstacle: i > 5 && Math.random() < 0.35,
          obsX: (Math.random() - 0.5) * (segW - 50)
        });
        curZ += segL;
        curY += 10;
        curX += (Math.random() - 0.5) * 40;
      }
    }

    function resetGame() {
      ball = { x: 0, y: 0, z: 0, vx: 0, vz: 2.2, r: 14 };
      score = 0;
      gameOver = false;
      document.getElementById('scoreText').textContent = '0';
      document.getElementById('gameOver').classList.add('hidden');
      initTrack();
    }

    document.getElementById('btnRestart').addEventListener('click', resetGame);

    function update() {
      if (gameOver) return;

      if (keys['ArrowLeft'] || keys['KeyA']) ball.vx = -4.5;
      else if (keys['ArrowRight'] || keys['KeyD']) ball.vx = 4.5;
      else if (touchX === null && Math.abs(ball.vx) > 0.1) ball.vx *= 0.85;

      ball.x += ball.vx;
      ball.z += ball.vz;
      ball.vz = Math.min(6.5, ball.vz + 0.0008); // Aceleración constante

      score = Math.floor(ball.z / 10);
      document.getElementById('scoreText').textContent = score;

      // Generar pista infinita
      while (track[0] && track[0].z + track[0].l < ball.z - 50) {
        const last = track[track.length - 1];
        track.shift();
        const segW = Math.max(90, 160 - score * 0.04);
        const segL = 100;
        track.push({
          x: last.x + (Math.random() - 0.5) * 60,
          y: last.y + 10,
          z: last.z + segL,
          w: segW,
          l: segL,
          hasObstacle: Math.random() < 0.45,
          obsX: (Math.random() - 0.5) * (segW - 40)
        });
      }

      // Comprobar si la pelota está sobre la pista actual
      const curSeg = track.find(s => ball.z >= s.z && ball.z <= s.z + s.l);
      if (curSeg) {
        const leftBound = curSeg.x - curSeg.w / 2;
        const rightBound = curSeg.x + curSeg.w / 2;

        if (ball.x < leftBound || ball.x > rightBound) {
          triggerGameOver();
        }

        if (curSeg.hasObstacle) {
          if (Math.abs(ball.x - (curSeg.x + curSeg.obsX)) < 26) {
            triggerGameOver();
          }
        }
      } else {
        triggerGameOver();
      }
    }

    function triggerGameOver() {
      gameOver = true;
      if (score > best) {
        best = score;
        localStorage.setItem('slope_best', best);
        document.getElementById('bestText').textContent = best;
      }
      document.getElementById('finalScore').textContent = score;
      document.getElementById('gameOver').classList.remove('hidden');
    }

    function project(x, y, z) {
      const fov = 350;
      const camZ = ball.z - 180;
      const camY = ball.y - 120;
      const relZ = z - camZ;
      if (relZ <= 10) return null;
      const scale = fov / relZ;
      return {
        x: width / 2 + (x - ball.x) * scale,
        y: height / 2 + (y - camY) * scale,
        scale: scale
      };
    }

    function draw() {
      ctx.fillStyle = '#050811';
      ctx.fillRect(0, 0, width, height);

      // Dibujar estrellas de fondo
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      for (let i = 0; i < 40; i++) {
        const sx = (Math.sin(i * 99 + ball.z * 0.001) * 0.5 + 0.5) * width;
        const sy = (Math.cos(i * 33) * 0.5 + 0.5) * height;
        ctx.fillRect(sx, sy, 2, 2);
      }

      // Dibujar pista en 3D
      track.forEach((seg, i) => {
        const p1 = project(seg.x - seg.w / 2, seg.y, seg.z);
        const p2 = project(seg.x + seg.w / 2, seg.y, seg.z);
        const p3 = project(seg.x + seg.w / 2, seg.y + 10, seg.z + seg.l);
        const p4 = project(seg.x - seg.w / 2, seg.y + 10, seg.z + seg.l);

        if (!p1 || !p2 || !p3 || !p4) return;

        // Color degradado neón
        ctx.fillStyle = i % 2 === 0 ? '#10b981' : '#047857';
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.lineTo(p4.x, p4.y);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#34d399';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Obstáculo rojo
        if (seg.hasObstacle) {
          const op = project(seg.x + seg.obsX, seg.y - 15, seg.z + seg.l / 2);
          if (op) {
            ctx.fillStyle = '#ef4444';
            ctx.strokeStyle = '#fee2e2';
            ctx.lineWidth = 2;
            const size = 30 * op.scale;
            ctx.fillRect(op.x - size / 2, op.y - size, size, size);
            ctx.strokeRect(op.x - size / 2, op.y - size, size, size);
          }
        }
      });

      // Dibujar la bola verde brillante
      const bp = project(ball.x, ball.y, ball.z);
      if (bp) {
        const r = ball.r * bp.scale;
        const grad = ctx.createRadialGradient(bp.x - r * 0.3, bp.y - r * 0.3, r * 0.1, bp.x, bp.y, r);
        grad.addColorStop(0, '#6ee7b7');
        grad.addColorStop(1, '#059669');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(bp.x, bp.y - r, r, 0, Math.PI * 2);
        ctx.fill();

        // Brillo neón
        ctx.shadowColor = '#10b981';
        ctx.shadowBlur = 20;
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    resetGame();
    loop();
  </script>
</body>
</html>
