<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Snake Classic HD - ezze.games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; font-family: 'Bungee', cursive; }
    body { background: #020617; color: #fff; width: 100vw; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; }
    .hud { display: flex; justify-content: space-between; width: 100%; max-width: 440px; margin-bottom: 12px; font-size: 16px; color: #22c55e; }
    #canvasWrap { position: relative; width: 100%; max-width: 440px; aspect-ratio: 1; border: 3px solid #22c55e; border-radius: 16px; overflow: hidden; box-shadow: 0 0 30px rgba(34, 197, 94, 0.3); }
    canvas { width: 100%; height: 100%; display: block; background: #0f172a; }
    .overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 20px; z-index: 20; }
    .overlay.hidden { display: none; }
    .btn-play { background: #22c55e; color: #000; font-family: 'Bungee'; font-size: 18px; padding: 12px 32px; border: none; border-radius: 12px; cursor: pointer; }
    .d-pad { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 6px; margin-top: 14px; }
    .d-btn { background: #1e293b; border: 2px solid #334155; color: #fff; font-size: 18px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .d-btn:active { background: #22c55e; color: #000; }
  </style>
</head>
<body>
  <div class="hud">
    <div>MANZANAS: <span id="scoreText" style="color: #facc15;">0</span></div>
    <div>RÉCORD: <span id="bestText" style="color: #38bdf8;">0</span></div>
  </div>
  <div id="canvasWrap">
    <canvas id="snakeCanvas" width="400" height="400"></canvas>
    <div class="overlay" id="startScreen">
      <h1 style="font-size: 36px; color: #22c55e;">SNAKE CLASSIC</h1>
      <p style="font-family: 'Outfit'; font-size: 14px; color: #94a3b8;">Desliza o usa las flechas para comer manzanas</p>
      <button class="btn-play" id="btnStart">JUGAR</button>
    </div>
    <div class="overlay hidden" id="gameOverScreen">
      <h1 style="font-size: 32px; color: #ef4444;">¡CHOCASTE!</h1>
      <p style="font-family: 'Outfit'; font-size: 16px; color: #cbd5e1;">Puntos: <strong id="finalScore" style="color: #facc15;">0</strong></p>
      <button class="btn-play" id="btnRestart">REINTENTAR</button>
    </div>
  </div>

  <div class="d-pad">
    <div></div><button class="d-btn" id="btnUp">▲</button><div></div>
    <button class="d-btn" id="btnLeft">◀</button><div></div><button class="d-btn" id="btnRight">▶</button>
    <div></div><button class="d-btn" id="btnDown">▼</button><div></div>
  </div>

  <script>
    const canvas = document.getElementById('snakeCanvas');
    const ctx = canvas.getContext('2d');

    const GRID = 20;
    const COUNT = 20;

    let snake = [{ x: 10, y: 10 }];
    let food = { x: 15, y: 10 };
    let dx = 1, dy = 0;
    let nextDx = 1, nextDy = 0;
    let score = 0;
    let best = parseInt(localStorage.getItem('snake_best') || '0');
    document.getElementById('bestText').textContent = best;
    let isPlaying = false;
    let gameLoop = null;

    function startGame() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      isPlaying = true;
      document.getElementById('scoreText').textContent = '0';
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      spawnFood();

      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 110);
    }

    function spawnFood() {
      food = {
        x: Math.floor(Math.random() * COUNT),
        y: Math.floor(Math.random() * COUNT)
      };
    }

    function setDirection(newDx, newDy) {
      if (newDx !== -dx && newDy !== -dy) {
        nextDx = newDx;
        nextDy = newDy;
      }
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp' || e.key === 'w') setDirection(0, -1);
      if (e.key === 'ArrowDown' || e.key === 's') setDirection(0, 1);
      if (e.key === 'ArrowLeft' || e.key === 'a') setDirection(-1, 0);
      if (e.key === 'ArrowRight' || e.key === 'd') setDirection(1, 0);
    });

    document.getElementById('btnUp').addEventListener('click', () => setDirection(0, -1));
    document.getElementById('btnDown').addEventListener('click', () => setDirection(0, 1));
    document.getElementById('btnLeft').addEventListener('click', () => setDirection(-1, 0));
    document.getElementById('btnRight').addEventListener('click', () => setDirection(1, 0));

    // Swipe táctil
    let touchStartX = 0, touchStartY = 0;
    window.addEventListener('touchstart', e => {
      if (e.touches.length > 0) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    window.addEventListener('touchend', e => {
      if (e.changedTouches.length > 0) {
        const dX = e.changedTouches[0].clientX - touchStartX;
        const dY = e.changedTouches[0].clientY - touchStartY;
        if (Math.max(Math.abs(dX), Math.abs(dY)) > 25) {
          if (Math.abs(dX) > Math.abs(dY)) setDirection(dX > 0 ? 1 : -1, 0);
          else setDirection(0, dY > 0 ? 1 : -1);
        }
      }
    }, { passive: true });

    function update() {
      if (!isPlaying) return;

      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Chocar con paredes
      if (head.x < 0 || head.x >= COUNT || head.y < 0 || head.y >= COUNT) {
        return triggerGameOver();
      }

      // Chocar con cuerpo
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        return triggerGameOver();
      }

      snake.unshift(head);

      // Comer manzana
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('scoreText').textContent = score;
        if (score > best) {
          best = score;
          localStorage.setItem('snake_best', best);
          document.getElementById('bestText').textContent = best;
        }
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function triggerGameOver() {
      isPlaying = false;
      clearInterval(gameLoop);
      document.getElementById('finalScore').textContent = score;
      document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Cuadrícula sutil
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      for (let i = 0; i < COUNT; i++) {
        ctx.beginPath(); ctx.moveTo(i * GRID, 0); ctx.lineTo(i * GRID, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * GRID); ctx.lineTo(canvas.width, i * GRID); ctx.stroke();
      }

      // Manzana
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Serpiente
      snake.forEach((s, idx) => {
        ctx.fillStyle = idx === 0 ? '#4ade80' : '#22c55e';
        ctx.fillRect(s.x * GRID + 1, s.y * GRID + 1, GRID - 2, GRID - 2);
      });
    }

    document.getElementById('btnStart').addEventListener('click', startGame);
    document.getElementById('btnRestart').addEventListener('click', startGame);

    draw();
  </script>
</body>
</html>
