<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Space Defenders Retro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #020617; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Courier New', monospace; color: #fff; overflow: hidden; }
    #canvas { border: 2px solid #38bdf8; border-radius: 10px; background: #030712; box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
    .hud { font-size: 18px; margin-bottom: 10px; display: flex; gap: 30px; }
  </style>
</head>
<body>
  <div class="hud">
    <span>PUNTOS: <strong id="score" style="color: #38bdf8;">0</strong></span>
    <span>VIDAS: <strong id="lives" style="color: #ef4444;">❤️❤️❤️</strong></span>
  </div>
  <canvas id="canvas" width="600" height="500"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let ship = { x: 280, y: 440, w: 36, h: 36, speed: 6 };
    let bullets = [];
    let enemies = [];
    let score = 0;
    let lives = 3;
    let keys = {};
    let gameOver = false;

    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.code === 'Space' && !gameOver) {
        bullets.push({ x: ship.x + 14, y: ship.y, speed: 8 });
      }
      if (e.code === 'Space' && gameOver) {
        reset();
      }
    });

    window.addEventListener('keyup', e => keys[e.key] = false);

    function reset() {
      bullets = [];
      enemies = [];
      score = 0;
      lives = 3;
      gameOver = false;
      document.getElementById('lives').textContent = '❤️❤️❤️';
      document.getElementById('score').textContent = '0';
    }

    function spawnEnemies() {
      if (Math.random() < 0.03 && enemies.length < 8) {
        enemies.push({ x: Math.random() * (canvas.width - 40), y: -30, w: 32, h: 32, speed: Math.random() * 2 + 1.5 });
      }
    }

    function update() {
      if (gameOver) return;

      if (keys['ArrowLeft'] || keys['a']) ship.x = Math.max(10, ship.x - ship.speed);
      if (keys['ArrowRight'] || keys['d']) ship.x = Math.min(canvas.width - ship.w - 10, ship.x + ship.speed);

      // Balas
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bullets[i].speed;
        if (bullets[i].y < -10) bullets.splice(i, 1);
      }

      spawnEnemies();

      // Enemigos
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.speed;

        // Choque con nave
        if (
          ship.x < e.x + e.w &&
          ship.x + ship.w > e.x &&
          ship.y < e.y + e.h &&
          ship.y + ship.h > e.y
        ) {
          enemies.splice(i, 1);
          lives--;
          document.getElementById('lives').textContent = '❤️'.repeat(Math.max(0, lives));
          if (lives <= 0) gameOver = true;
          continue;
        }

        // Choque con balas
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
            enemies.splice(i, 1);
            bullets.splice(j, 1);
            score += 100;
            document.getElementById('score').textContent = score;
            break;
          }
        }

        if (e.y > canvas.height + 20) enemies.splice(i, 1);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Estrellas
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      for (let i = 0; i < 30; i++) {
        const sx = (i * 37 + Date.now() / 20) % canvas.width;
        const sy = (i * 91) % canvas.height;
        ctx.fillRect(sx, sy, 2, 2);
      }

      // Balas
      ctx.fillStyle = '#38bdf8';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, 6, 12));

      // Nave
      ctx.font = '30px sans-serif';
      ctx.fillText('🚀', ship.x, ship.y + 26);

      // Enemigos
      enemies.forEach(e => {
        ctx.fillText('👾', e.x, e.y + 26);
      });

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = '32px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('¡GAME OVER!', canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = '#38bdf8';
        ctx.font = '16px Courier New';
        ctx.fillText('Presiona ESPACIO para reintentar', canvas.width / 2, canvas.height / 2 + 25);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
