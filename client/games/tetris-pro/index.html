<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Retro Tetris Pro - ezze.games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; font-family: 'Outfit', sans-serif; }
    body { background: #0f172a; color: #fff; width: 100vw; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 12px; }
    #tetrisLayout { display: flex; gap: 16px; align-items: center; max-width: 500px; width: 100%; }
    .side-panel { display: flex; flex-direction: column; gap: 12px; min-width: 100px; }
    .panel-box { background: #1e293b; border: 2px solid #334155; padding: 10px; border-radius: 12px; text-align: center; }
    .panel-box span { font-size: 11px; color: #94a3b8; font-weight: 800; text-transform: uppercase; }
    .panel-box div { font-size: 20px; font-weight: 900; font-family: 'Bungee'; color: #facc15; }
    .main-board-wrap { position: relative; background: #020617; border: 3px solid #3b82f6; border-radius: 12px; overflow: hidden; box-shadow: 0 0 25px rgba(59, 130, 246, 0.4); }
    canvas#boardCanvas { display: block; }
    /* Mobile Controls */
    .touch-pad { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; justify-content: space-around; padding: 0 10px; pointer-events: none; z-index: 30; }
    .t-btn { width: 56px; height: 56px; border-radius: 50%; background: rgba(30, 41, 59, 0.85); border: 2px solid #fff; color: #fff; font-family: 'Bungee'; font-size: 20px; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
    .t-btn:active { background: #3b82f6; }
    .overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 20px; z-index: 40; }
    .overlay.hidden { display: none; }
    .btn-play { background: #3b82f6; color: #fff; font-family: 'Bungee'; font-size: 18px; padding: 12px 30px; border: none; border-radius: 12px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="tetrisLayout">
    <div class="main-board-wrap">
      <canvas id="boardCanvas" width="240" height="480"></canvas>
      <div class="overlay" id="startScreen">
        <h1 style="font-family: 'Bungee'; font-size: 32px; color: #3b82f6;">TETRIS PRO</h1>
        <p style="font-size: 13px; color: #94a3b8;">¡Completa líneas para sumar puntos!</p>
        <button class="btn-play" id="btnStart">JUGAR</button>
      </div>
      <div class="overlay hidden" id="gameOverScreen">
        <h1 style="font-family: 'Bungee'; font-size: 28px; color: #ef4444;">¡GAME OVER!</h1>
        <p style="font-size: 15px; color: #cbd5e1;">Puntos: <strong id="finalScore" style="color: #facc15;">0</strong></p>
        <button class="btn-play" id="btnRestart">REINTENTAR</button>
      </div>
    </div>
    <div class="side-panel">
      <div class="panel-box">
        <span>SIGUIENTE</span>
        <canvas id="nextCanvas" width="80" height="80" style="display:block; margin: 6px auto 0;"></canvas>
      </div>
      <div class="panel-box">
        <span>PUNTOS</span>
        <div id="scoreText">0</div>
      </div>
      <div class="panel-box">
        <span>LÍNEAS</span>
        <div id="linesText">0</div>
      </div>
    </div>
  </div>

  <div class="touch-pad">
    <button class="t-btn" id="btnLeft">◀</button>
    <button class="t-btn" id="btnRotate">↻</button>
    <button class="t-btn" id="btnRight">▶</button>
    <button class="t-btn" style="background: rgba(239, 68, 68, 0.8);" id="btnDrop">▼</button>
  </div>

  <script>
    const canvas = document.getElementById('boardCanvas');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('nextCanvas');
    const nextCtx = nextCanvas.getContext('2d');

    const COLS = 10;
    const ROWS = 20;
    const BLOCK = 24;

    const SHAPES = [
      { m: [[1,1,1,1]], c: '#06b6d4' }, // I
      { m: [[1,1],[1,1]], c: '#facc15' }, // O
      { m: [[0,1,0],[1,1,1]], c: '#c084fc' }, // T
      { m: [[1,0,0],[1,1,1]], c: '#3b82f6' }, // J
      { m: [[0,0,1],[1,1,1]], c: '#f97316' }, // L
      { m: [[0,1,1],[1,1,0]], c: '#22c55e' }, // S
      { m: [[1,1,0],[0,1,1]], c: '#ef4444' }  // Z
    ];

    let grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    let piece = null;
    let nextPiece = null;
    let score = 0;
    let lines = 0;
    let isPlaying = false;
    let dropInterval = 800;
    let lastDrop = 0;

    function randomPiece() {
      const p = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      return { matrix: p.m, color: p.c, x: Math.floor(COLS / 2) - Math.floor(p.m[0].length / 2), y: 0 };
    }

    function startGame() {
      grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      score = 0;
      lines = 0;
      piece = randomPiece();
      nextPiece = randomPiece();
      isPlaying = true;
      document.getElementById('scoreText').textContent = '0';
      document.getElementById('linesText').textContent = '0';
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      drawNext();
    }

    function collide(grid, p, offX = 0, offY = 0) {
      for (let r = 0; r < p.matrix.length; r++) {
        for (let c = 0; c < p.matrix[r].length; c++) {
          if (p.matrix[r][c] !== 0) {
            const newX = p.x + c + offX;
            const newY = p.y + r + offY;
            if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
            if (newY >= 0 && grid[newY][newX] !== 0) return true;
          }
        }
      }
      return false;
    }

    function merge() {
      piece.matrix.forEach((row, r) => {
        row.forEach((val, c) => {
          if (val !== 0) grid[piece.y + r][piece.x + c] = piece.color;
        });
      });

      // Limpiar líneas
      let cleared = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r].every(c => c !== 0)) {
          grid.splice(r, 1);
          grid.unshift(Array(COLS).fill(0));
          cleared++;
          r++;
        }
      }

      if (cleared > 0) {
        lines += cleared;
        score += [0, 100, 300, 500, 800][cleared];
        document.getElementById('scoreText').textContent = score;
        document.getElementById('linesText').textContent = lines;
      }

      piece = nextPiece;
      nextPiece = randomPiece();
      drawNext();

      if (collide(grid, piece)) {
        isPlaying = false;
        document.getElementById('finalScore').textContent = score;
        document.getElementById('gameOverScreen').classList.remove('hidden');
      }
    }

    function rotate(p) {
      const m = p.matrix;
      const rotated = m[0].map((_, i) => m.map(row => row[i]).reverse());
      const oldM = p.matrix;
      p.matrix = rotated;
      if (collide(grid, p)) p.matrix = oldM;
    }

    function drop() {
      if (!isPlaying) return;
      if (!collide(grid, piece, 0, 1)) {
        piece.y++;
      } else {
        merge();
      }
    }

    function hardDrop() {
      if (!isPlaying) return;
      while (!collide(grid, piece, 0, 1)) piece.y++;
      merge();
    }

    window.addEventListener('keydown', e => {
      if (!isPlaying) return;
      if (e.key === 'ArrowLeft' || e.key === 'a') if (!collide(grid, piece, -1, 0)) piece.x--;
      if (e.key === 'ArrowRight' || e.key === 'd') if (!collide(grid, piece, 1, 0)) piece.x++;
      if (e.key === 'ArrowUp' || e.key === 'w') rotate(piece);
      if (e.key === 'ArrowDown' || e.key === 's') drop();
      if (e.key === ' ') hardDrop();
    });

    document.getElementById('btnLeft').addEventListener('click', () => { if (!collide(grid, piece, -1, 0)) piece.x--; });
    document.getElementById('btnRight').addEventListener('click', () => { if (!collide(grid, piece, 1, 0)) piece.x++; });
    document.getElementById('btnRotate').addEventListener('click', () => rotate(piece));
    document.getElementById('btnDrop').addEventListener('click', drop);

    document.getElementById('btnStart').addEventListener('click', startGame);
    document.getElementById('btnRestart').addEventListener('click', startGame);

    function drawNext() {
      nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
      if (!nextPiece) return;
      const m = nextPiece.matrix;
      const offX = (nextCanvas.width - m[0].length * 18) / 2;
      const offY = (nextCanvas.height - m.length * 18) / 2;
      m.forEach((row, r) => {
        row.forEach((val, c) => {
          if (val !== 0) {
            nextCtx.fillStyle = nextPiece.color;
            nextCtx.fillRect(offX + c * 18, offY + r * 18, 16, 16);
          }
        });
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Dibujar cuadrícula fija
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c] !== 0) {
            ctx.fillStyle = grid[r][c];
            ctx.fillRect(c * BLOCK, r * BLOCK, BLOCK - 1, BLOCK - 1);
          }
        }
      }

      // Dibujar pieza activa
      if (piece) {
        piece.matrix.forEach((row, r) => {
          row.forEach((val, c) => {
            if (val !== 0) {
              ctx.fillStyle = piece.color;
              ctx.fillRect((piece.x + c) * BLOCK, (piece.y + r) * BLOCK, BLOCK - 1, BLOCK - 1);
            }
          });
        });
      }
    }

    function loop(time = 0) {
      if (isPlaying && time - lastDrop > dropInterval) {
        drop();
        lastDrop = time;
      }
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
