<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Mascota Virtual Eze - ezze.games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Outfit', sans-serif; }
    body { background: linear-gradient(180deg, #fbcfe8 0%, #f472b6 50%, #db2777 100%); color: #0f172a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; }
    .pet-house { width: 100%; max-width: 440px; background: rgba(255, 255, 255, 0.9); border: 4px solid #db2777; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); backdrop-filter: blur(10px); }
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat-box { background: #fdf2f8; border: 1.5px solid #f472b6; padding: 6px; border-radius: 12px; text-align: center; font-size: 11px; font-weight: 800; color: #9d174d; }
    .stat-bar { width: 100%; height: 8px; background: #fce7f3; border-radius: 6px; overflow: hidden; margin-top: 4px; border: 1px solid #f472b6; }
    .stat-fill { height: 100%; background: #ec4899; width: 80%; transition: width 0.3s ease; }
    .pet-stage { width: 100%; aspect-ratio: 1; background: radial-gradient(circle, #fdf2f8 30%, #fce7f3 100%); border-radius: 20px; border: 2px dashed #f472b6; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .pet-avatar { font-size: 96px; cursor: pointer; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); animation: floatPet 2.5s infinite ease-in-out; }
    @keyframes floatPet { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .pet-hat { position: absolute; font-size: 42px; top: 55px; pointer-events: none; }
    .pet-glasses { position: absolute; font-size: 32px; top: 95px; pointer-events: none; }
    .pet-status { font-family: 'Bungee'; font-size: 16px; color: #db2777; margin-top: 8px; }
    .actions-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .btn-act { background: #fdf2f8; border: 2px solid #db2777; border-radius: 14px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-size: 11px; font-weight: 800; color: #db2777; transition: transform 0.1s, background 0.1s; }
    .btn-act:active { transform: scale(0.94); background: #fce7f3; }
    .btn-act span { font-size: 24px; }
  </style>
</head>
<body>
  <div class="pet-house">
    <div class="stats-row">
      <div class="stat-box">
        ❤️ FELICIDAD
        <div class="stat-bar"><div class="stat-fill" id="happyFill" style="width: 80%;"></div></div>
      </div>
      <div class="stat-box">
        🍎 HAMBRE
        <div class="stat-bar"><div class="stat-fill" id="hungerFill" style="width: 60%; background: #f59e0b;"></div></div>
      </div>
      <div class="stat-box">
        🧼 LIMPIEZA
        <div class="stat-bar"><div class="stat-fill" id="cleanFill" style="width: 90%; background: #06b6d4;"></div></div>
      </div>
    </div>

    <div class="pet-stage" id="petStage" onclick="petMascot()">
      <div class="pet-hat" id="petHat"></div>
      <div class="pet-glasses" id="petGlasses"></div>
      <div class="pet-avatar" id="petAvatar">🐱</div>
      <div class="pet-status" id="petStatus">¡HOLA AMIGO! 💖</div>
    </div>

    <div class="actions-grid">
      <button class="btn-act" onclick="feedPet('🍎')">
        <span>🍎</span> Manzana
      </button>
      <button class="btn-act" onclick="feedPet('🍕')">
        <span>🍕</span> Pizza
      </button>
      <button class="btn-act" onclick="cleanPet()">
        <span>🧼</span> Bañar
      </button>
      <button class="btn-act" onclick="toggleWardrobe()">
        <span>🎩</span> Disfraz
      </button>
    </div>
  </div>

  <script>
    let happy = 80, hunger = 60, clean = 90;
    let hatIdx = 0, glassesIdx = 0;
    const HATS = ['', '👑', '🎩', '🎀', '🧢', '🎓'];
    const GLASSES = ['', '🕶️', '🥸', '🥽'];

    let audioCtx = null;
    function playTone(freq, dur = 0.12) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
      } catch(e){}
    }

    function updateBars() {
      document.getElementById('happyFill').style.width = happy + '%';
      document.getElementById('hungerFill').style.width = hunger + '%';
      document.getElementById('cleanFill').style.width = clean + '%';
    }

    function petMascot() {
      happy = Math.min(100, happy + 8);
      updateBars();
      document.getElementById('petStatus').textContent = '¡RONRONEO! 🥰';
      playTone(520, 0.1);
      setTimeout(() => playTone(680, 0.15), 80);

      const avatar = document.getElementById('petAvatar');
      avatar.style.transform = 'scale(1.2) rotate(5deg)';
      setTimeout(() => avatar.style.transform = 'none', 250);
    }

    function feedPet(food) {
      hunger = Math.min(100, hunger + 20);
      happy = Math.min(100, happy + 5);
      clean = Math.max(0, clean - 5);
      updateBars();
      document.getElementById('petStatus').textContent = `¡ÑAM ÑAM ${food}! 😋`;
      playTone(350, 0.1);
      setTimeout(() => playTone(450, 0.15), 100);
    }

    function cleanPet() {
      clean = 100;
      happy = Math.min(100, happy + 10);
      updateBars();
      document.getElementById('petStatus').textContent = '¡LIMPIO Y FRESCO! 🫧✨';
      playTone(700, 0.1);
      setTimeout(() => playTone(950, 0.2), 100);
    }

    function toggleWardrobe() {
      hatIdx = (hatIdx + 1) % HATS.length;
      document.getElementById('petHat').textContent = HATS[hatIdx];
      document.getElementById('petStatus').textContent = '¡NUEVO LOOK! ✨';
      playTone(600, 0.15);
    }
  </script>
</body>
</html>
